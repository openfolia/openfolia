        data:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseChangeResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
            previous:
              nullable: true
              description: >-
                The release the changes are counted from: the product’s newest
