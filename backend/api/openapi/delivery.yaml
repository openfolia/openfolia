        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DitaPackageDocument'
        '400':
          description: >-
            `invalid-parameter`: `languages` or `references` is not one of its
            values; `unsupported-parameter` for any other query parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no release with this ID, or no output of it you may
            read.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `dita-package-too-large`: the package would read more modules, or
            write more, than one package may, or be larger than
            `CCMS_RELEASE_ARCHIVE_MAX_BYTES` (`meta` says which bound).
            `dita-notices-unsupported`: the manual is a derived manual gathering
            safety notices (`rule.notices`, #670), which a DITA package of whole
            modules cannot hold.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          description: >-
            `rate-limited`: too many packages are being made at once;
            `Retry-After` says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Make a release’s DITA package and describe it
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /releases/{releaseId}/dita-packages/{packageId}/file:
    get:
      description: >-
        The package as a ZIP archive (`application/zip`), every entry stored,
        sorted by name: per language a folder with the map
        (`<lang>/<manual>.ditamap`, naming the DITAVAL file) and the topics
        (`<lang>/<module>.dita`), then `filters/<variant>.ditaval`,
        `images/<sha256>.<ext>`, `files/<sha256>.<ext>` and `symbols/<name>`.
