  /releases/{releaseId}/iirds-packages/{packageId}/file:
    get:
      description: >-
        The package as an iiRDS ZIP archive (`application/iirds+zip`):
        `mimetype` first, then `META-INF/metadata.rdf`, the topics
        (`content/<module>.html`), the media they show (`media/<sha256>.<ext>`,
        `symbols/<id>.<ext>`) and the PDF
        (`pdf/<manual>_<variant>_<lang>_<revision>.pdf`, once done), every entry
        stored. The same release output makes the same bytes.
        `Content-Disposition: attachment` with
        `<manual>_<variant>_<lang>_<revision>.iirds`, `Content-Length` its exact
        length, `X-Ccms-Iirds-Warnings` how many warnings `GET
        …/iirds-packages/{packageId}` lists. Not cached (`private, no-store`):
        it gains the PDF once that is done. A blob store failing once part of it
        went out cuts the connection, and so does a download not read for a
        while, read too slowly or going on too long (`CCMS_PACKAGE_SEND_*`),
        freeing its turn. Needs `content.read` at the release’s tag, in a role
        that covers all of the output’s manual: its audience and language, with
        no module type or facet left out, and the source language too, as for
        the release’s outputs. A package is made as the manual’s audience reads
        it, the same for all of its readers. Others get 404, exactly like a
        missing one.
