            or a value it does not take (the page’s `theme`). The parameters
            `CCMS_DELIVERY_IGNORED_QUERY` names (default `utm_*`: the tracking
            parameters a shared link picks up) are ignored, so such a link opens
            as the address without them: an exception to the API’s rule, as
            these are reader-facing addresses, not the JSON:API.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: '`delivery.access` is `signed-in` and the request has no token.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no manual at this address for this reader. `not-found`
            also when `delivery.access` is `off`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '409':
          description: >-
            `public-url-not-set`: `CCMS_PUBLIC_URL` is not set, so there is no
            address to hold.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '410':
          description: >-
            `release-withdrawn`: the pinned release was withdrawn; the latest
            address (without `@<revision>`) opens the current one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          description: >-
            `rate-limited`: more pages, PDFs and QR codes under `/d/` this
            minute than `CCMS_DELIVERY_PER_MINUTE` allows one client on this
            server (default 60): a request without a token by its address
            (`CCMS_TRUST_PROXY` says which proxies in front to believe about
            it), one with a token or a session by its actor (on a `public`
            address, which reads no credentials, everyone by their address). A
            304 revalidation of a page or a PDF counts nothing. `Retry-After`
            (and `meta.retryAfter`) says when to try again.
          headers:
            Retry-After:
              description: Seconds until the next request fits.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: The QR code of a stable PDF address, as PNG
      tags:
        - stable-addresses
      x-audience: delivery
      x-required-permission: content.read
  /d/{product}/{manual}/{variant}/{lang}/assets/{hash}:
    get:
      description: >-
        An image the page shows, as `GET /assets/{sha256}` serves it at the
        release’s tag, for the reader. Its bytes never change, but who may read
        them can (a withdrawal, `delivery.access`): a public one is `public,
        max-age=86400, s-maxage=<CCMS_DELIVERY_SHARED_MAX_AGE>,
        proxy-revalidate` (a shared cache asks again after that, default 300 s,
        and is told 410 once the release is withdrawn), a signed-in reader’s
        `private, max-age=86400`; the ETag is the hash, so a revalidation is a
        304 without reading the file. Who may open it is `delivery.access` in
        `openfolia.yaml` on `main`, at most the deployment’s
        `CCMS_DELIVERY_MAX_ACCESS` (default `public`, no cap): `public`, anyone,
        without a token, as a reader of the `delivery.publicAudience` level
        (default the first audience), always: a session, a token or any other
        credential sent with the request is ignored (never checked, counted or
        refused), so a signed-in person sees exactly what the public sees and
        the answer varies by no credential (no `Vary: Cookie` or
        `Authorization`); `signed-in` (default), a reader with a token or a
        signed-in session, in their scope (401 without one); `off`, nobody
        (404). Only released content is ever shown, a release’s tag, never a
        branch or a draft; a manual, variant or language the reader may not see
        is 404, exactly like a missing one, and so is a moved address, until the
        reader may see what it leads to.
      operationId: StableAddresses_asset
      parameters:
        - name: hash
          required: true
          in: path
          schema:
            type: string
        - name: product
          required: true
          in: path
          description: 'The product: a value of the product facet.'
          schema:
            type: string
            example: north
        - name: manual
          required: true
          in: path
          description: >-
            The manual’s address: `delivery.manuals.<id>.slug`, else its ID; a
            former one (`formerly`) is 301 to the current.
          schema:
            type: string
            example: operating
        - name: variant
          required: true
          in: path
          description: The variant’s slug (`model=large`).
          schema:
            type: string
            example: model=large
        - name: lang
          required: true
          in: path
          description: >-
            The language; `<lang>@<revision>` pins one release (`en@2.1`), else
            the product’s latest release (the newest of `main` not withdrawn).
            Another case of a configured language is 301 to it; one the release
            does not have is the language picker (300) or 302 to the source
            language (`delivery.missingLanguage`).
          schema:
            type: string
            example: en
      responses:
        '200':
          description: The image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '301':
          description: >-
            The address moved for good: a former address of the manual
            (`delivery.manuals.<id>.formerly`), its ID where it has a slug, or
            another letter case of the language. `Location` is the current
            address, relative to this one.
          headers:
            Location:
              description: Where the address is now, relative to the request’s path.
              schema:
                type: string
        '302':
          description: >-
            A language the release does not have, with
            `delivery.missingLanguage: source`: `Location` is the same address
            in the source language, relative to this one.
          headers:
            Location:
              description: Where the address is now, relative to the request’s path.
              schema:
                type: string
        '400':
          description: >-
            `unsupported-parameter`: a query parameter the route does not take,
            or a value it does not take (the page’s `theme`). The parameters
            `CCMS_DELIVERY_IGNORED_QUERY` names (default `utm_*`: the tracking
            parameters a shared link picks up) are ignored, so such a link opens
            as the address without them: an exception to the API’s rule, as
            these are reader-facing addresses, not the JSON:API.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: '`delivery.access` is `signed-in` and the request has no token.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no manual at this address for this reader. `not-found`
            also when `delivery.access` is `off`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '410':
          description: >-
            `release-withdrawn`: the pinned release was withdrawn; the latest
            address (without `@<revision>`) opens the current one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: An image of a stable address’s page
      tags:
        - stable-addresses
      x-audience: delivery
      x-required-permission: content.read
