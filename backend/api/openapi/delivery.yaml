            output of the release you may read, malformed or not, is 404.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The package.
          content:
            application/iirds+zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: '`attachment` with the file name.'
              schema:
                type: string
            X-Ccms-Iirds-Warnings:
              description: How many warnings the package has.
              schema:
                type: integer
        '400':
          description: An unsupported query parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no release with this ID, or no output of it you may
            read.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `iirds-not-configured`: the configuration at the release’s tag holds
            no iiRDS mapping (`iirds` in `openfolia.yaml`).
            `iirds-package-too-large`: the package would be larger than
            `CCMS_RELEASE_ARCHIVE_MAX_BYTES` (`meta.size`, `meta.limit` in
            bytes, `meta.files`). `expansion-too-large`: once its module
            references are included the manual holds more than 500,000 content
            nodes, 12,000,000 characters or 1,000,000 table cells (rows ×
            columns) (a module referred to over several paths counts once per
            path), or its blocks and references nest more than 100 deep, so
            nothing of it is made (`meta.nodes`, `meta.chars`,
            `meta.tableCells`, `meta.depth`: the limits).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          description: >-
            `rate-limited`: too many packages are being made at once, or this
            kind of package sent: at most 4 at once, server-wide, and at most
            `CCMS_PACKAGE_SENDS_PER_ACTOR` (default 1) of them yours. Answered
            before any header of the file. `Retry-After` says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            `blob-store-unavailable`: the blob store does not answer;
            `Retry-After` says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Download a release’s iiRDS package
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /downloads:
    get:
      description: >-
