          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ReleaseChangeResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ReleaseChange
        id:
          type: string
        attributes:
          type: object
          properties:
            manual:
              type: string
              description: The manual’s ID.
            lang:
              type: string
              description: The language, a language tag.
          required:
            - manual
            - lang
          additionalProperties: false
        meta:
          type: object
          properties:
            change:
              type: string
              enum:
                - added
                - changed
                - removed
              description: >-
                `added` (new since the previous release, or every manual of a
                product’s first release), `removed`, or `changed` (its manifest,
                or a module it names in this language).
            fields:
              type: array
              items:
                type: string
              description: >-
                The manifest’s members that differ (`title`, `entries`,
                `variants`, …); empty unless `changed`.
            modules:
              type: array
              items:
                type: object
                properties:
                  moduleId:
                    type: string
                  change:
                    type: string
                    enum:
                      - added
                      - changed
                      - removed
                  fields:
                    type: array
                    items:
                      type: string
                    description: >-
                      Its metadata that differs (`title`, `type`, `audience`,
                      …); empty when added or removed.
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        blockId:
                          type: string
                        change:
                          type: string
                          enum:
                            - added
                            - changed
                            - removed
                      required:
                        - blockId
                        - change
                      additionalProperties: false
                    description: >-
                      Its blocks, list items and procedure steps that differ, by
                      ID (as a change set’s changes list them).
                required:
                  - moduleId
                  - change
                  - fields
                  - blocks
                additionalProperties: false
              description: >-
                The modules the manual names (in either release) whose file in
                this language changed, by ID; empty unless `changed`.
          required:
            - change
            - fields
            - modules
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
      additionalProperties: false
      description: >-
        `id` is `<lang>/<manualId>`. Derived from Git, as the reader sees both
        releases: nothing of it is stored.
    ChangelogPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogEntryResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
            truncated:
              type: boolean
              description: >-
                Filtered by manual or language, only the newest releases
