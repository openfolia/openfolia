                    - $ref: '#/components/schemas/StableAddressLink'
              required:
                - html
                - pdf
              additionalProperties: false
              description: This release, for good (`@<revision>`).
          required:
            - product
            - manual
            - slug
            - variant
            - lang
            - revision
            - latest
            - pinned
          additionalProperties: false
        relationships:
          type: object
          properties:
            release:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Release
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
          required:
            - release
          additionalProperties: false
        meta:
          type: object
          properties:
            latestRelease:
              type: boolean
              description: >-
                The release is its product’s latest: the latest address opens it
                now.
            withdrawn:
              type: boolean
              description: >-
                The release is withdrawn: its pinned address shows a notice that
                links the latest.
            pdfReady:
              type: boolean
              description: The PDF is rendered (its output `done`), so `pdf` opens it.
          required:
            - latestRelease
            - withdrawn
            - pdfReady
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - relationships
        - meta
      additionalProperties: false
      description: >-
        A manual’s stable addresses in one variant and language (#450): where
        readers open it, with a QR code at `<path>/qr.svg` and `<path>/qr.png`.
    StableAddressLink:
      type: object
      properties:
        path:
          type: string
          description: >-
            From the API’s root, e.g. `/d/north/operating/model=large/en`;
            behind the editor’s web server, at its root too.
        url:
          nullable: true
          description: >-
            The absolute URL readers open (`CCMS_PUBLIC_URL` and `path`), what
            the QR code holds; null while `CCMS_PUBLIC_URL` is not set.
          type: string
      required:
        - path
        - url
      additionalProperties: false
security:
  - bearer: []
