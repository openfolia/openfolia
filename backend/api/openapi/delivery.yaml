            is neither the source nor a target. It does nothing, and the next
            save of the configuration leaves it out.
        path:
          type: string
          description: Where in the configuration, e.g. `languages.direction.fa`.
        message:
          type: string
      required:
        - code
        - path
        - message
      additionalProperties: false
