            `manual:<product>:<manual>:<lang>:<variant>`). One that names no
            download you may read, malformed or not, is 404.
          schema:
            type: string
            minLength: 1
            maxLength: 1400
            description: >-
              The download’s ID, as `GET /downloads` gives it:
              `attachment:<product>:<module>:<block>:<lang>` or
              `manual:<product>:<manual>:<lang>:<variant>`.
        - name: releaseId
          required: true
