            text/css:
              schema:
                type: string
          description: ''
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: No such file.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: A stylesheet of the stable address pages
      tags:
        - stable-addresses
      x-audience: delivery
  /d/{product}/{manual}/{variant}/{lang}:
    get:
      description: >-
        The manual as a web page, as `GET
        /manuals/{id}/variants/{variant}/{lang}/html` renders it, at the
        product’s latest release (or the pinned one): the address to print and
        to link (#450). A new release moves it at once (`no-cache`, with an ETag
        known before the page is rendered, from the release, the reader’s scope,
        the theme and the build, `CCMS_BUILD_ID`: a revalidation is a 304
        without rendering); a pinned address revalidates too (`no-cache`, with
        an ETag), so a withdrawal or a change of `delivery.access` reaches every
        cache, `public` for a public reader, else `private`. A pinned release
        that was withdrawn is 410 with a notice linking the latest address. Who
        may open it is `delivery.access` in `openfolia.yaml` on `main`, at most
        the deployment’s `CCMS_DELIVERY_MAX_ACCESS` (default `public`, no cap):
        `public`, anyone, without a token, as a reader of the
        `delivery.publicAudience` level (default the first audience), always: a
        session, a token or any other credential sent with the request is
        ignored (never checked, counted or refused), so a signed-in person sees
        exactly what the public sees and the answer varies by no credential (no
        `Vary: Cookie` or `Authorization`); `signed-in` (default), a reader with
        a token or a signed-in session, in their scope (401 without one); `off`,
        nobody (404). Only released content is ever shown, a release’s tag,
        never a branch or a draft; a manual, variant or language the reader may
        not see is 404, exactly like a missing one, and so is a moved address,
        until the reader may see what it leads to.
      operationId: StableAddresses_page
      parameters:
        - name: theme
          required: false
          in: query
          description: >-
            Colour scheme. `auto` (default) follows the viewer’s
            `prefers-color-scheme`; `light` and `dark` force one.
          schema:
            default: auto
            type: string
            enum:
              - auto
              - light
              - dark
            description: >-
              Colour scheme. `auto` (default) follows the viewer’s
              `prefers-color-scheme`; `light` and `dark` force one.
        - name: product
          required: true
          in: path
          description: 'The product: a value of the product facet.'
          schema:
            type: string
            example: north
        - name: manual
          required: true
          in: path
          description: >-
            The manual’s address: `delivery.manuals.<id>.slug`, else its ID; a
            former one (`formerly`) is 301 to the current.
          schema:
            type: string
            example: operating
        - name: variant
          required: true
          in: path
          description: The variant’s slug (`model=large`).
          schema:
            type: string
            example: model=large
        - name: lang
          required: true
          in: path
          description: >-
            The language; `<lang>@<revision>` pins one release (`en@2.1`), else
            the product’s latest release (the newest of `main` not withdrawn).
            Another case of a configured language is 301 to it; one the release
            does not have is the language picker (300) or 302 to the source
            language (`delivery.missingLanguage`).
          schema:
            type: string
            example: en
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema:
                type: string
        '300':
          description: >-
            A language the release does not have, with
            `delivery.missingLanguage: picker` (the default): a page linking the
            manual in each language the reader may read.
          content:
            text/html:
              schema:
                type: string
        '301':
          description: >-
            The address moved for good: a former address of the manual
            (`delivery.manuals.<id>.formerly`), its ID where it has a slug, or
            another letter case of the language. `Location` is the current
            address, relative to this one.
          headers:
            Location:
              description: Where the address is now, relative to the request’s path.
              schema:
                type: string
        '302':
          description: >-
            A language the release does not have, with
            `delivery.missingLanguage: source`: `Location` is the same address
            in the source language, relative to this one.
          headers:
            Location:
              description: Where the address is now, relative to the request’s path.
              schema:
                type: string
        '400':
          description: >-
            `unsupported-parameter`: a query parameter the route does not take,
            or a value it does not take (the page’s `theme`). The parameters
            `CCMS_DELIVERY_IGNORED_QUERY` names (default `utm_*`: the tracking
            parameters a shared link picks up) are ignored, so such a link opens
            as the address without them: an exception to the API’s rule, as
            these are reader-facing addresses, not the JSON:API.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: '`delivery.access` is `signed-in` and the request has no token.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no manual at this address for this reader. `not-found`
            also when `delivery.access` is `off`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header does not take `text/html`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '410':
          description: >-
            The pinned release was withdrawn: a notice page, linking the latest
            address when there is one.
          content:
            application/vnd.api+json:
              schema:
                type: string
        '429':
          description: >-
            `rate-limited`: more pages, PDFs and QR codes under `/d/` this
            minute than `CCMS_DELIVERY_PER_MINUTE` allows one client on this
            server (default 60): a request without a token by its address
            (`CCMS_TRUST_PROXY` says which proxies in front to believe about
            it), one with a token or a session by its actor (on a `public`
            address, which reads no credentials, everyone by their address). A
            304 revalidation of a page or a PDF counts nothing. `Retry-After`
            (and `meta.retryAfter`) says when to try again.
          headers:
            Retry-After:
              description: Seconds until the next request fits.
              schema:
                type: integer
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Open a manual at its stable address
      tags:
        - stable-addresses
      x-audience: delivery
      x-required-permission: content.read
  /d/{product}/{manual}/{variant}/{lang}/pdf:
    get:
      description: >-
        The release’s PDF of the manual in this variant and language (#249),
        shown in place (`Content-Disposition: inline`), never rendered on
        request: 409 `output-not-ready` while it is rendered. Only for a reader
        one of whose roles covers all of the manual (as `GET
        /releases/{id}/outputs` judges it). Cached as the page is. Who may open
        it is `delivery.access` in `openfolia.yaml` on `main`, at most the
        deployment’s `CCMS_DELIVERY_MAX_ACCESS` (default `public`, no cap):
