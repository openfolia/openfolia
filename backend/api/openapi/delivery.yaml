          type: string
        attributes:
          $ref: '#/components/schemas/ReleaseAttributes'
        meta:
          type: object
          properties:
            changedManuals:
              nullable: true
              description: >-
                How many manuals it changed, as you see them (`GET
                /releases/{releaseId}/changes`); null when too many files
                changed to compare.
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required:
            - changedManuals
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
      additionalProperties: false
    ReleaseOutputPageDocument:
      type: object
      properties:
        data:
          type: array
