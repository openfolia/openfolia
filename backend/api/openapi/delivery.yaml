openapi: 3.0.0
paths:
  /health:
    get:
      description: >-
        Liveness, for orchestrators deciding whether to restart the instance;
        needs no token. Always 200 while the server runs (content and PDF routes
        work without the database); `database` is `unavailable` when it does not
        answer within 2 seconds. A load balancer choosing instances to route to
        uses `/health/ready`.
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      summary: Health check
      tags:
        - health
      x-audience: delivery
      security: []
  /assets/{hash}:
    get:
      description: >-
        With `width` (320, 640 or 1280): the image as a WebP at most that wide
        (never upscaled; at most four times as tall), made on first request and
        kept in the blob store, after the same checks as the original (404 where
        the original is 404); a file other than a PNG, JPEG, GIF or WebP image
        has none (400). Images are content-addressed: modules refer to them as
        `sha256:<hash>`, and the bytes live in the blob store (older content:
        `assets/<hash>` in the repository). Only an image a module the reader
        may see refers to is served; any other is 404, like a missing one.
        Streamed with the stored type (sniffed for the old layout),
        `X-Content-Type-Options: nosniff` and a sandboxing
        `Content-Security-Policy`, so author-supplied SVGs can never run
        scripts; a type other than an image is sent as an attachment. A file an
        attachment block the reader may see attaches is always a download
        (`Content-Disposition: attachment` with an RFC 8187 `filename*`), under
        the file name of the first such block that fits the stored type, else
        the hash. Cached like every content route: `private, max-age=31536000,
        immutable` when `?ref=` is a commit ID, else `private, no-cache` with an
        ETag (who may see an image can change, its bytes cannot).
      operationId: Assets_read
      parameters:
        - name: hash
          required: true
          in: path
          description: SHA-256 of the file, 64 hex characters.
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
        - name: width
          required: false
          in: query
          description: >-
            A rendition instead of the file: a WebP at most this many pixels
            wide (320, 640, 1280), never upscaled. Only for PNG, JPEG, GIF and
            WebP images.
          schema:
            type: string
            enum:
              - '320'
              - '640'
              - '1280'
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The image or attached file, with its stored type (any type for an
            attachment).
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: >-
            Not a SHA-256 hash; `invalid-parameter` (`source.parameter`
            `width`): a width other than 320, 640 or 1280, or a rendition of a
            file that has none (SVG, anything but PNG, JPEG, GIF and WebP).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            With `width`: `too-large`, the image has more pixels
            (`meta.maxPixels`) or bytes (`meta.max`) than a rendition is made
            of; `unprocessable-image`, it cannot be decoded within the limits.
            Use the original.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            `blob-store-unavailable`; with `width`, `rendition-busy`: too many
            renditions are being made (`Retry-After`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Read an image
      tags:
        - assets
      x-audience: delivery
      x-required-permission: content.read
  /symbols/{id}:
    get:
      description: >-
        The artwork of a configured safety symbol (`safetySymbols` in `GET
        /config`): `symbols/<id>.png` or `symbols/<id>.svg` (the PNG when both
        exist, as the PDF picks), in the repository at `?ref=`, as the PDF
        prints it. Symbols are configuration, so every reader of the ref may
        read them. 404 when the ID is not configured or has no artwork (the PDF
        prints a grey placeholder then, the HTML leaves the symbol out); 422
        `invalid-content` when the bytes are not what the extension says (an
        `.svg` that is no SVG, a `.png` that is no PNG): the type is always read
        from the bytes. Served as the image routes serve images:
        `Content-Disposition: inline`, `X-Content-Type-Options: nosniff` and a
        sandboxing `Content-Security-Policy`, so an SVG can never run a script;
        show it as an image, never inline its markup. Cached like every content
        route: `private, max-age=31536000, immutable` when `?ref=` is a commit
        ID, else `private, no-cache` with an ETag.
      operationId: Symbols_read
      parameters:
        - name: id
          required: true
          in: path
          description: The safety symbol’s configured ID.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
            example: w001
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          description: The artwork, as SVG or PNG.
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: >-
            Not a configuration key; `unsupported-parameter` for a query
            parameter other than `ref`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `invalid-content`: the file’s bytes are not the image its extension
            names.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Read a safety symbol’s artwork
      tags:
        - assets
      x-audience: delivery
      x-required-permission: content.read
  /refs:
    get:
      description: >-
        Branches, then tags, each with the commit it points to. Without
        `content.read.draft`, only `main` and the tags.
      operationId: Project_refs
      parameters:
        - name: page[number]
          required: false
          in: query
          description: 'Page to return, from 1. Default: 1.'
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          required: false
          in: query
          description: 'Resources per page. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RefPageDocument'
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Branches and tags
      tags:
        - project
      x-audience: delivery
      x-required-permission: content.read
  /config:
    get:
      description: >-
        Languages, audiences, module types, variant attributes and safety
        symbols (`openfolia.yaml`). With an iiRDS mapping (`iirds`),
        `meta.iirdsIssues` checks it against the rest: what it leaves unmapped,
        keys naming nothing; with a DITA mapping (`dita`), `meta.ditaIssues`
        lists its values naming nothing configured; `meta.directionIssues` lists
        each `languages.direction` entry for a language not configured.
      operationId: Project_config
      parameters:
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ProjectConfigDocument'
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `invalid-content`: a file needed for the answer is broken; the
            error's `meta.path` names it. `table-too-large`: a module file holds
            a table of more than 1,000 columns or 50,000 cells (rows × columns),
            or tables of more than 1,000,000 cells together, so it is not read
            (`meta.path`; `meta.columns`, `meta.cells`, `meta.totalCells`: the
            caps).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Project configuration
      tags:
        - project
      x-audience: delivery
      x-required-permission: content.read
  /modules:
    get:
      description: >-
        The modules the reader may see, ordered by language and ID (or `sort`),
        filtered on the module index before paging (the total counts only
        those), each with its status in `meta.status` and where it is used in
        `meta.usedIn` and `meta.usage` (only manuals and modules the reader may
        see). A module file that cannot be read is listed with its error to a
        reader of everything in its language; a filter on metadata or status
        leaves it out.
      operationId: Modules_list
      parameters:
        - name: filter[lang]
          required: false
          in: query
          description: Only modules in this language.
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        - name: filter[type]
          required: false
          in: query
          description: Only modules of this module type.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[audience]
          required: false
          in: query
          description: >-
            Only modules that count as this audience level: their own, or the
            last, most restricted level for a module naming none, as manuals and
            the access check place it. A level the configuration does not list
            matches nothing, and a module naming such a level matches no level.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[facet]
          required: false
          in: query
          description: >-
            Only modules with this facet value, as `<facet>:<value>` (e.g.
            `region:north`). Repeat it for several, at most 32: a module has to
            have every one.
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: filter[keyword]
          required: false
          in: query
          description: >-
            Only modules with this keyword, case and diacritics aside (`Wärme`
            is `warme`); 1 to 64 characters, no comma. Repeat it for several, at
            most 32: a module has to have every one.
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: filter[product]
          required: false
          in: query
          description: >-
            Only modules with this value of the product facet
            (`release.productFacet` in the configuration, else the first facet),
            as releases name products; none when there is no facet.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[status]
          required: false
          in: query
          description: >-
            Only modules that stand so (`meta.status`): `released` (the newest
            release holding the module holds exactly this file), `changed` (a
            release holds it, but this file differs), `unreleased` (none of the
            50 newest releases holds it) or `in-change-set` (an open change set
            the reader may read changes it; none for a reader who is not told of
            change sets).
          schema:
            type: string
            enum:
              - released
              - changed
              - unreleased
              - in-change-set
        - name: sort
          required: false
          in: query
          description: >-
            Comma-separated fields (`id`, `lang`, `title`, `type`, `usage`;
            `usage` is the count of manuals and modules using it), each
            `-`-prefixed for descending, each at most once; ties by language,
            then ID. A file that cannot be read sorts after the rest by title
            and type. Default: `lang,id`.
          schema:
            type: string
        - name: page[number]
          required: false
          in: query
          description: 'Page to return, from 1. Default: 1.'
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          required: false
          in: query
          description: 'Resources per page. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ModulePageDocument'
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `invalid-content`: a file needed for the answer is broken; the
            error's `meta.path` names it. `table-too-large`: a module file holds
            a table of more than 1,000 columns or 50,000 cells (rows × columns),
            or tables of more than 1,000,000 cells together, so it is not read
            (`meta.path`; `meta.columns`, `meta.cells`, `meta.totalCells`: the
            caps).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: List modules
      tags:
        - modules
      x-audience: delivery
      x-required-permission: content.read
  /modules/{lang}/{id}:
    get:
      description: >-
        One module in one language, with the problems found checking it against
        the project configuration, its status (`meta.status`: the newest release
        holding it, `main`, the open change sets changing it), derived from Git,
        and where it is used (`meta.usedIn`, `meta.usage`: only manuals and
        modules the reader may see).
      operationId: Modules_read
      parameters:
        - name: lang
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
            example: en
        - name: id
          required: true
          in: path
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            example: battery-charging
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ModuleDocument'
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
