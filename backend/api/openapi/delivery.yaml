          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ReleaseOutputResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ReleaseOutput
        id:
          type: string
        attributes:
          type: object
          properties:
            manual:
              nullable: true
              description: The manual’s ID; null for an offline package (all of them).
              type: string
            variant:
              nullable: true
              description: >-
                The variant’s slug, e.g. `model=large` (the manifest’s); null
                for an offline package (every variant).
              type: string
            lang:
              type: string
              description: The language, a language tag.
            kind:
              type: string
              enum:
                - pdf
                - offline-package
              description: >-
                What it is: `pdf`, a manual in one variant and language;
                `offline-package` (#59), a ZIP of every manual the language and
                audience level reads, as HTML pages and PDFs, that opens from
                the file system without a network.
            audience:
              nullable: true
              description: >-
                The audience level an offline package is for (it holds what that
                level reads); null for a PDF, and for a package when no levels
                are configured.
              type: string
            state:
              type: string
              enum:
                - queued
                - rendering
                - done
                - failed
              description: >-
                `queued` (its render job waits), `rendering` (an attempt
                started; one retried after a passing failure stays here), `done`
                (the file is there) or `failed` (for good; `POST …/retry` queues
                it again).
            sha256:
              nullable: true
              description: >-
                The file’s SHA-256 (the blob store’s key); null until done.
                Outputs that reuse a file share it.
              type: string
            size:
              nullable: true
              description: The file’s size in bytes; null until done.
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            error:
              nullable: true
              description: >-
                Why it failed (or, while it is retried, why the latest attempt
                did); null otherwise.
              type: object
              properties:
                code:
                  type: string
                  description: >-
                    Stable: `pdf-accessibility`, `render-timeout`,
                    `render-failed`, `invalid-content`, `renderer-busy`,
                    `render-error`, …
                detail:
                  type: string
              required:
                - code
                - detail
              additionalProperties: false
            createdAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            updatedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            finishedAt:
              nullable: true
              description: When it was done or failed; null while queued or rendering.
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required:
            - manual
            - variant
            - lang
            - kind
            - audience
            - state
            - sha256
            - size
            - error
            - createdAt
            - updatedAt
            - finishedAt
          additionalProperties: false
        meta:
          type: object
          properties:
            reusedFrom:
              nullable: true
              description: >-
                The release did not change the manual in this language: the
                output (of an earlier release) whose file this one is. Null when
                rendered for this release.
              type: object
              properties:
                releaseId:
                  type: string
                outputId:
                  type: string
              required:
                - releaseId
                - outputId
              additionalProperties: false
            attempts:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              description: Render attempts started, over every retry.
            retries:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              description: How often it was queued again after failing.
            withdrawn:
              type: boolean
              description: >-
                The release is withdrawn: the file stays readable at its tag,
                but it is no longer the product’s current one.
            design:
              description: >-
                The page design the manual is printed with at the release’s tag;
                absent for an offline package.
              allOf:
                - $ref: '#/components/schemas/DesignInUse'
          required:
            - reusedFrom
            - attempts
            - retries
            - withdrawn
          additionalProperties: false
        links:
          type: object
          properties:
            file:
              nullable: true
              description: The file (`GET …/outputs/{outputId}/file`); null until done.
              type: string
          required:
            - file
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
        - links
      additionalProperties: false
      description: >-
        One file of a release: a manual in one variant and language, rendered at
        the release’s tag as the manual’s audience reads it, so it is the same
        for everyone who may read the manual; or an offline package (#59) of one
        language and audience level, built from the release’s tag as that level
        reads it.
    TermPageDocument:
