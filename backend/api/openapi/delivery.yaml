        …/dita-packages/{packageId}` lists. A blob store failing once part of it
        went out cuts the connection, and so does a download not read for a
        while, read too slowly or going on too long (`CCMS_PACKAGE_SEND_*`),
        freeing its turn. Needs `content.read` at the release’s tag, in a role
        that covers all of the output’s manual: its audience and language, with
        no module type or facet left out, and the source language too, as for
        the release’s outputs. A package is made as the manual’s audience reads
        it, the same for all of its readers. Others get 404, exactly like a
        missing one.
      operationId: DitaPackageFile_file
      parameters:
        - name: releaseId
          required: true
          in: path
          description: >-
            The release’s ID (a UUID). One that names no release, malformed or
            not, is 404.
          schema:
            type: string
            format: uuid
        - name: packageId
          required: true
          in: path
          description: >-
            The package’s ID: its release output’s (a UUID). One that names no
            output of the release you may read, malformed or not, is 404.
          schema:
            type: string
            format: uuid
        - name: languages
          required: false
          in: query
          description: >-
            `output` (the default): the output’s language only; `all`: every
            configured language you may read the whole manual in, each a folder.
          schema:
            type: string
            enum:
              - output
              - all
        - name: references
          required: false
          in: query
          description: >-
            `conref` (the default): a module reference is a content reference
            (`@conref`, `@conrefend`) where DITA can say one, else its content;
            `resolved`: always its content.
          schema:
            type: string
            enum:
              - conref
              - resolved
      responses:
        '200':
          description: The package.
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: '`attachment` with the file name.'
              schema:
                type: string
            X-Ccms-Dita-Warnings:
              description: How many warnings the package has.
              schema:
                type: integer
        '400':
          description: >-
            `invalid-parameter`: `languages` or `references` is not one of its
            values; `unsupported-parameter` for any other query parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no release with this ID, or no output of it you may
            read.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `dita-package-too-large`: the package would read more modules, or
            write more, than one package may, or be larger than
            `CCMS_RELEASE_ARCHIVE_MAX_BYTES` (`meta` says which bound).
            `dita-notices-unsupported`: the manual is a derived manual gathering
            safety notices (`rule.notices`, #670), which a DITA package of whole
            modules cannot hold.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          description: >-
            `rate-limited`: too many packages are being made at once, or this
            kind of package sent: at most 4 at once, server-wide, and at most
            `CCMS_PACKAGE_SENDS_PER_ACTOR` (default 1) of them yours. Answered
            before any header of the file. `Retry-After` says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            `blob-store-unavailable`: the blob store does not answer;
            `Retry-After` says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Download a release’s DITA package
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /d/-/fonts/{name}:
    get:
      description: >-
        The theme’s font, as `GET /preview/fonts/{name}` serves it, for the
        pages under `/d/`. Who may open it is `delivery.access` in
        `openfolia.yaml` on `main`, at most the deployment’s
        `CCMS_DELIVERY_MAX_ACCESS` (default `public`, no cap): `public`, anyone,
        without a token, as a reader of the `delivery.publicAudience` level
        (default the first audience), always: a session, a token or any other
        credential sent with the request is ignored (never checked, counted or
        refused), so a signed-in person sees exactly what the public sees and
        the answer varies by no credential (no `Vary: Cookie` or
        `Authorization`); `signed-in` (default), a reader with a token or a
        signed-in session, in their scope (401 without one); `off`, nobody
        (404). Only released content is ever shown, a release’s tag, never a
        branch or a draft; a manual, variant or language the reader may not see
        is 404, exactly like a missing one, and so is a moved address, until the
        reader may see what it leads to.
      operationId: StableAddresses_font
      parameters:
        - name: name
          required: true
          in: path
          schema:
            example: Geist-Variable.woff2
            type: string
      responses:
        '200':
          content:
            font/woff2:
              schema:
                type: string
                format: binary
          description: ''
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: No such file.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: A font of the stable address pages
      tags:
        - stable-addresses
      x-audience: delivery
  /d/-/{name}:
    get:
      description: >-
        `theme.css`, `theme-dark.css`, `render-html.css` and `page.css`, as `GET
        /preview/{name}` serves them, for the pages under `/d/`. Who may open it
        is `delivery.access` in `openfolia.yaml` on `main`, at most the
        deployment’s `CCMS_DELIVERY_MAX_ACCESS` (default `public`, no cap):
        `public`, anyone, without a token, as a reader of the
        `delivery.publicAudience` level (default the first audience), always: a
        session, a token or any other credential sent with the request is
        ignored (never checked, counted or refused), so a signed-in person sees
        exactly what the public sees and the answer varies by no credential (no
        `Vary: Cookie` or `Authorization`); `signed-in` (default), a reader with
        a token or a signed-in session, in their scope (401 without one); `off`,
        nobody (404). Only released content is ever shown, a release’s tag,
        never a branch or a draft; a manual, variant or language the reader may
        not see is 404, exactly like a missing one, and so is a moved address,
