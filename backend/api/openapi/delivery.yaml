        - name: base
          required: true
          in: query
          description: 'The older version: a commit ID or a tag.'
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: head
          required: true
          in: query
          description: 'The newer version: a commit ID or a tag.'
