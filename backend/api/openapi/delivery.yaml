        (`meta.change`, `meta.fields`), so the review screen’s manual diff
        renders it. Each side is read as reading its commit needs: a released
        commit (`main`’s head, a release tag) with `content.read`, any other,
        also an older commit of `main`, with `content.read.draft`, else 404 as
        for a ref that does not exist. Each side shows the manual only as the
        reader would see it on the other too (its audience, and only the modules
        a manifest may name to them on both); a side where it is not there is
        `added` or `removed`; 404 when neither has it.
