        the product, or no product), in each language it has a file in, and one
        per PDF of a manual, variant and language that is rendered (`done`). A
        read model over attachments and release outputs: nothing is uploaded
        here. Filtered before paging, so neither the list nor the total tells of
        a file outside your scope. Ordered by product, then attachments (by
        module, language and block order) before manuals (by manual, variant and
