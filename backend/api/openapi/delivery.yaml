  /stable-addresses:
    get:
      description: >-
        One entry per manual, variant and language of a release’s outputs (#249)
        the reader may read (a role covering all of the manual, as `GET
        /releases/{id}/outputs` judges it): its latest and pinned addresses
        (page and PDF), as paths and, with `CCMS_PUBLIC_URL` set, as URLs.
        Without `filter[release]`, of each product’s latest release (the newest
        of `main` not withdrawn), in the product facet’s order. `meta.access`
        says who may open them. Ordered by release, then manual, variant,
        language.
      operationId: StableAddressList_addresses
      parameters:
        - name: filter[release]
          required: false
          in: query
          description: >-
            One release’s addresses (its ID). Default: each product’s latest
            release.
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: filter[product]
          required: false
          in: query
          description: Only this product’s latest release.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[manual]
          required: false
          in: query
          description: Only this manual’s addresses (its ID).
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        - name: filter[lang]
          required: false
          in: query
          description: Only addresses in this language.
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        - name: page[number]
          required: false
          in: query
          description: 'Page to return, from 1. Default: 1.'
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          required: false
          in: query
          description: 'Resources per page. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StableAddressPageDocument'
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: '`not-found`: no release with the ID `filter[release]` names.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: List stable addresses
      tags:
        - stable-addresses
      x-audience: delivery
      x-required-permission: content.read
info:
  title: OpenFolia delivery API
  description: >-
    The read routes of the content platform, for building your own viewer,
    portal or app integration: the project configuration, modules, manuals, a
    manual resolved for one variant and language, HTML and PDF output, and
    images. Authoring, review and administration routes are not part of this
    document.


    ## Authentication


    Every route except `GET /health` needs `Authorization: Bearer <token>`. Ask
    an administrator for a **service account** token (`ccms_sat_…`): it acts
    through the service account's roles, and for a consumer that is a role
    holding **only `content.read`** in the scope you need (languages, module
    types, audience levels), which reads released content only, `main` and
    release tags. A token expires (90 days by default) and can be revoked at any
    time; it is meant for your server, not for end users, so keep it out of
    browser apps and apps you hand to others, and send it only in the
    `Authorization` header, never in a URL. A revoked or expired token is `401`
    (`token-revoked`, `token-expired`), one of a deactivated service account
    `403 service-account-deactivated`; too many failed attempts from one address
    are `429 too-many-failed-attempts` with `Retry-After`. A route never reveals
    what lies outside the reader's scope: such content answers `404 not-found`,
    exactly like content that does not exist. Without a token, or with a wrong
    one, the answer is `401`; a reader without `content.read` gets `403
    forbidden`. `GET /preview/{name}` and `GET /preview/fonts/{name}` (the
    stylesheets and fonts of the HTML pages) need a token but no permission.


    ## Refs and caching


    Every content route reads one version of the content, chosen with `?ref=`:
    `main`, a **release tag** (a published, named version) or a **commit ID**.
    Without `ref` the server's default applies (normally `main`). `GET /refs`
    lists the refs you may read, each with the commit it points to. `GET
    /releases` lists the releases, newest first, each a product revision with
    its notes (also per language, `attributes.notesByLanguage`), whether it is
    `major`, and its tag (`attributes.tag`): pass the tag as `?ref=` to read
    exactly what was released. A release tag never moves. A release can be
    **withdrawn** (`attributes.withdrawal`: who, when, why): its tag stays
    readable, but it no longer counts as a module’s newest release. Where you
    read it by tag you learn so: in `GET /refs` the tag carries
    `meta.withdrawal` (`{ by, at, reason }`, null while the release stands), and
    every read at the tag answers with the header `X-Ccms-Withdrawn: true`
    (absent otherwise; a read by the tag’s commit ID is not marked). Its `ETag`
    changes when the release is withdrawn, so a cached answer is not confirmed.


    ## Changelog


    `GET /changelog` lists the releases newest first, withdrawn ones marked with
    their reason, each with its notes and in `meta.changedManuals` how many
    manuals it changed (`filter[product]`, `filter[manual]`, `filter[lang]`,
    `filter[major]`). `GET /releases/{releaseId}/changes` lists what one release
    changed against its product's previous release that stands: one entry per
    manual and language, with the modules that changed in it (`added`,
    `changed`, `removed`, with their blocks by ID); a product's first release
    lists every manual as added. Both are scoped like every read: a manual or
    module outside the reader's scope is never named or counted.


    The commit a response was read from is in the `X-Ccms-Commit` header.
    Caching follows the ref:


    - A **commit ID** never changes: the response is `Cache-Control: private,
    max-age=31536000, immutable`. Pin a commit (or resolve `main` or a tag to
    its commit once and request that) to cache for good.

    - `main` can move, and a tag is not a commit ID, so the response is
    `private, no-cache` with an `ETag`. Send it back as `If-None-Match` and a
    `304` costs almost nothing.


    The `ETag` also depends on what the reader may see, so two readers with
    different scopes never share a cached answer.


    ## Downloads


    `GET /downloads` lists every downloadable file of each product at its latest
    release: the files attached in modules (`kind` `attachment`) and the
    manuals' PDFs (`manual`), each with its name, file name, media type, size
    and SHA-256 checksum (`filter[product]`, `filter[lang]`, `filter[kind]`,
    `filter[mediaType]`, `filter[q]`). `GET /downloads/{id}/versions` lists one
    file's versions across the product's releases, newest first, one where its
    checksum changed, each `current`, `superseded` or `withdrawn` with its
    release and change note; `GET /downloads/{id}/versions/{releaseId}/file`
    sends that version's file. Scoped like every read: a file in a module
    outside the reader's scope is never listed, counted or given versions.


    ## Variants, languages and resolving a manual


    A **module** is one piece of content in one language. A **manual** is a
    manifest that lists modules; one manual yields many outputs, one per
    **variant** and **language**.


    - `GET /config` lists the languages, module types, audience levels and the
    variant attributes with their values. Nothing is hardcoded: read it instead
    of assuming.

    - `GET /manuals/{id}` shows the manual with the variants it publishes: each
    variant is a slug of `attribute=value` pairs joined by commas, with a label.

    - `GET /manuals/{id}/variants/{variant}/{lang}` is the **resolved manual**:
    the manifest with its conditions applied for that variant, the modules in
    reading order with their content, ready to render. Use the slug exactly as
    `GET /manuals/{id}` gives it.

    - `GET /modules` and `GET /modules/{lang}/{id}` read single modules, for
    example to build a search index or a help panel.


    A manual, variant or language that does not exist is a `404`. On `GET
    /modules/{lang}/{id}/preview`, an optional `?variant=` naming an attribute
    or value the configuration does not know is a `422 unknown-variant`.


    ## Search


    `GET /search?filter[q]=` finds modules by title, keywords and text and
    manuals by title, at the same `?ref=` as every other read and among what the
    reader may see (scoped like every read). Each result carries a plain-text
    `meta.excerpt` (never markup) and `meta.matches`, the `{ start, end }`
    offsets of the matches in the excerpt in UTF-16 units, so a client
    highlights by slicing text. Optional filters, applied before paging:
    `filter[lang]`, `filter[resourceType]` (`Module` or `Manual`), and for
    modules `filter[type]` (a module type), `filter[audience]`,
    `filter[facet]=<facet>:<value>` and `filter[keyword]` (an exact keyword,
    case and diacritics aside), the last two repeatable, every value required.
    With a module filter, `filter[q]` may be left out. `filter[type]=module` or
    `manual` still means `filter[resourceType]` when that is not given
    (deprecated). Results are paged like every list.


    ## Retrieval chunks


    `GET /chunks` gives the content as ready-made chunks for a retrieval (RAG)
    pipeline: one per module and language the reader may see, the module as
    Markdown in `attributes.text` with the metadata to filter on (`moduleType`,
    `audience`, `facets`, `keywords`, `manuals`, the variant `conditions`, the
    newest release in `meta.release`) and `contentHash`, the SHA-256 of the
    text. Scoped like every read: a module outside the reader’s scope is never
    listed, counted or inlined into another chunk. `filter[variant]` resolves
    variant blocks for one variant; without it each is kept, headed by its
    condition.


    To sync: page through `GET /chunks?ref=main` and store each chunk by its
    `id`, embedding it only when its `contentHash` is new; keep the
    `X-Ccms-Commit` of the first page and read every later page at `?ref=<that
    commit>`. Next time, ask for `GET
    /chunks?ref=main&filter[changedSince]=<that commit>`: only the chunks that
    may have changed since. Chunks of modules deleted since are not listed
    there: a full sync now and then drops them. A new release changes
    `meta.release` but no file, so sync in full after a release.


    ## Images


    Content refers to an image as `sha256:<hash>`. Fetch it from `GET
    /assets/{hash}` with the same `?ref=` as the content that referred to it.
    The bytes of a hash never change, so the answer is cacheable like any
    commit-pinned response. An image the reader may not see, or that the ref
    does not use, is `404`.


    ## HTML and PDF


    You can render the resolved manual yourself, or take a rendering from the
    server:


    - `GET /manuals/{id}/variants/{variant}/{lang}/html` and `GET
    /modules/{lang}/{id}/preview` return a complete HTML page (`text/html`). It
    links its stylesheets and fonts (`GET /preview/{name}`, `GET
    /preview/fonts/{name}`) and its images relative to its own URL, and it
    follows the viewer's light or dark setting unless you pass `theme=light` or
    `theme=dark`. The page carries a strict content security policy: no script,
    nothing from another origin.

    - `GET /manuals/{id}/variants/{variant}/{lang}/pdf` returns the PDF
    (`application/pdf`); the header `X-Ccms-Issues` gives the number of content
    issues found while resolving. A busy renderer answers `503 renderer-busy`
    with `Retry-After`: wait that many seconds and ask again.


    ## Responses and errors


    JSON responses follow [JSON:API](https://jsonapi.org/format/)
    (`application/vnd.api+json`; send an `Accept` header that allows it, or the
    answer is `406`). Resources are `{ type, id, attributes, relationships, meta
    }`: `attributes` hold stored data in camelCase, `meta` what the server
    derives from it (validation issues, summaries). Every list is paged:
    `page[number]` (from 1) and `page[size]` (default 50, at most 200), with
    `meta.page` and `links` to follow. A query parameter a route does not
    support is `400`.


    Errors have the same shape on every route, binary ones and HTML pages
    included: `{ "errors": [{ "status", "title", "detail", "code", "source"?,
    "meta"? }] }`. Branch on `code` (for example `not-found`,
    `invalid-parameter`, `unknown-variant`, `renderer-busy`), which is stable;
    `detail` is text for people and may change. `source.parameter` names a bad
    parameter; `meta.retryAfter` is the seconds to wait.


    ## Health


    `GET /health` needs no token and answers whether the server runs, for
    monitoring.
  version: '0.1'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: >-
        A service account's token (`ccms_sat_…`, issued by `POST
        /service-accounts/{id}/tokens`), or, for local use and demo mode, the
        server's shared `CCMS_API_TOKEN`.
  schemas:
    ErrorDocument:
      type: object
      properties:
        errors:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      required:
        - errors
      additionalProperties: false
    ErrorObject:
      type: object
      properties:
        status:
          type: string
          description: The HTTP status code, as a string.
        title:
          type: string
          description: The HTTP status text.
        detail:
          type: string
          description: What went wrong, for people.
        code:
          type: string
          description: Stable machine-readable code, e.g. `invalid-content`.
        source:
          type: object
          properties:
            parameter:
              description: The query or path parameter at fault.
              type: string
            header:
              description: The request header at fault.
              type: string
            pointer:
              description: >-
                JSON pointer to the request body member at fault; for working
                copies being committed, into the working copy:
                `/module/<lang>/<moduleId>` or `/manual/<manualId>`, then
                `/blocks/<block ID>` when a block is at fault.
              type: string
          additionalProperties: false
        meta:
          description: >-
            Details, e.g. `path` (the repository file at fault), `retryAfter`
            (seconds) or `diagnostics` (PDF compiler messages).
          type: object
          additionalProperties: {}
      required:
        - status
        - title
        - detail
        - code
      additionalProperties: false
    PageMeta:
      type: object
      properties:
        currentPage:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        lastPage:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        perPage:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        total:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Resources across all pages.
      required:
        - currentPage
        - lastPage
        - perPage
        - total
      additionalProperties: false
    PageLinks:
      type: object
      properties:
        self:
          type: string
        first:
          type: string
        last:
          type: string
        prev:
          nullable: true
          type: string
        next:
          nullable: true
          type: string
      required:
        - self
        - first
        - last
        - prev
        - next
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: '`degraded` when a dependency is unavailable'
        database:
          type: string
          enum:
            - ok
            - unavailable
        pool:
          type: string
          enum:
            - ok
            - saturated
          description: '`saturated` when queries wait for a free database connection'
        blobs:
          type: string
          enum:
            - ok
            - unavailable
          description: '`unavailable` when the blob store (images, files) does not answer'
      required:
        - status
        - database
        - pool
        - blobs
      additionalProperties: false
    RefPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RefResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
          required:
            - page
          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    RefResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - Ref
        id:
          type: string
        attributes:
          type: object
          properties:
            kind:
              type: string
              enum:
                - branch
                - tag
            name:
              type: string
            commit:
              type: string
              description: The commit it points to (tags are peeled).
          required:
            - kind
            - name
            - commit
          additionalProperties: false
        meta:
          description: Tags only.
          type: object
          properties:
            withdrawal:
              nullable: true
              description: >-
                Set when the tag is a withdrawn release’s: reads at it keep
                working, and say so in `X-Ccms-Withdrawn: true`. Null while the
                release stands, or when the tag is no release’s.
              type: object
              properties:
                by:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - user
                        - service
                    id:
                      type: string
                  required:
                    - kind
                    - id
                  additionalProperties: false
                  description: Who withdrew it.
                at:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  description: When.
                reason:
                  type: string
                  description: Why, in their words.
              required:
                - by
                - at
                - reason
              additionalProperties: false
          required:
            - withdrawal
          additionalProperties: false
      required:
        - type
        - id
        - attributes
      additionalProperties: false
      description: '`id` is `heads/<branch>` or `tags/<tag>`.'
    ProjectConfigDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProjectConfigResource'
      required:
        - data
      additionalProperties: false
    ProjectConfigResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ProjectConfig
        id:
          type: string
        attributes:
          $ref: '#/components/schemas/ProjectConfig'
        meta:
          description: >-
            Only when the configuration holds an iiRDS or a DITA mapping, or a
            direction for a language not configured.
          type: object
          properties:
            iirdsIssues:
              description: >-
                The check of the iiRDS mapping (`iirds`, #431) against the rest
                of the configuration, in the configuration’s order: what it
                leaves unmapped and keys naming nothing. Never refused, only
                reported. Bounded by the configuration (at most one per value it
                defines or key the mapping has). Only with an iiRDS mapping.
              type: array
              items:
                $ref: '#/components/schemas/IirdsMappingIssue'
            ditaIssues:
              description: >-
                The check of the DITA mapping (`dita`, #432) against the rest of
                the configuration, in the mapping’s order: each value naming
                nothing configured. Never refused, only reported. Bounded by the
                mapping (at most one per value). Only with a DITA mapping.
              type: array
              items:
                $ref: '#/components/schemas/DitaMappingIssue'
            directionIssues:
              description: >-
                Each `languages.direction` entry for a language not configured
                (#396), sorted by tag. Never refused, only reported. Bounded by
                `languages.direction`. Only when there is one.
              type: array
              items:
                $ref: '#/components/schemas/LanguageDirectionIssue'
          additionalProperties: false
      required:
        - type
        - id
        - attributes
      additionalProperties: false
      description: 'A singleton: `id` is always `project`.'
    ProjectConfig:
      type: object
      properties:
        languages:
          type: object
          properties:
            source:
              type: string
              pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
              description: >-
                The language content is written in, as a BCP 47 tag, e.g. `en`
                or `pt-BR`. Every module has a file in it; a missing translation
                falls back to it.
            targets:
              type: array
              items:
                type: string
                pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
              description: >-
                The languages content is translated into, as BCP 47 tags, e.g.
                `[de, fr-CA]`; no repeats, and not the source language. Manuals
                are made in the source language and in each of these. An empty
                list: no translations.
            direction:
              description: >-
                Per language tag, the direction its text runs in, `ltr` or
                `rtl`, where its script’s own is not the one wanted, e.g. `{ ku:
                rtl }` for Kurdish written in Arabic script. A language left out
                takes its script’s direction (Arabic and Hebrew script run right
                to left); an entry for a language not configured does nothing.
              type: object
              additionalProperties:
                type: string
                enum:
                  - ltr
                  - rtl
          required:
            - source
            - targets
          additionalProperties: false
          description: >-
            The project’s languages: the one content is written in and the ones
            it is translated into.
        moduleTypes:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
                description: >-
                  The module type’s ID, which each module names in its `type`,
                  e.g. `task`, `concept` or `safety`. Lowercase letters, digits
                  and `-`, starting with a letter, at most 64 characters; unique
                  in its list.
              label:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                description: >-
                  The module type’s name in the editor, e.g. `Task`. One text
                  for every language, or one per language by language tag (`{
                  en: Task, de: Handlung }`), the source language’s among them;
                  a language without its own shows the source language’s.
              restricted:
                default: false
                description: >-
                  `true`: a change set that changes a module of this type also
                  needs a sign-off from someone with the `content.approve`
                  permission over those modules (not its author, unless the
                  installation allows self-approval) before it is merged, e.g.
                  for safety content. Left out: `false`, the review’s approval
                  is enough.
                type: boolean
              snippet:
                default: false
                description: >-
                  `true`: modules of this type hold reusable wording (a standard
                  sentence, a safety paragraph), one or a few blocks that
                  authors insert by reference or copy and that the editor
                  suggests while writing. Left out: `false`, an ordinary module
                  type.
                type: boolean
              safety:
                description: >-
                  `true`: modules of this type are safety content. A derived
                  manual (`kind: derived`, e.g. a safety leaflet) whose rule
                  names no module types gathers the modules of these types from
                  its source manual, and its checks warn about a module of one
                  it leaves out. Left out: `false`.
                type: boolean
            required:
              - id
              - label
              - restricted
              - snippet
            additionalProperties: false
          description: >-
            The kinds of module the project writes, at least one, each `{ id,
            label }`. A module’s type decides whether it needs a sign-off, which
            roles may change it, and how exports classify it.
        audiences:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
                description: >-
                  The audience level’s ID, which a module’s `audience` and a
                  manual’s `audience` name, e.g. `operator` or `technician`.
                  Lowercase letters, digits and `-`, starting with a letter, at
                  most 64 characters; unique in its list.
              label:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                description: >-
                  The audience level’s name in the editor and on title pages,
                  e.g. `Operator`. One text for every language, or one per
                  language by language tag (`{ en: Task, de: Handlung }`), the
                  source language’s among them; a language without its own shows
                  the source language’s.
            required:
              - id
              - label
            additionalProperties: false
          description: >-
            The audience levels, at least one, ordered from the least to the
            most restricted, each `{ id, label }`. A manual for one level leaves
            out modules for the levels after it; a module that names no audience
            gets the last, most restricted one.
        facets:
          default: []
          description: >-
            Classifications of modules, each `{ id, label, values }`, e.g. a
            product line or a region: for finding and filtering modules, for
            keeping a role to some of them, and for the products a release is
            cut for (`release.productFacet`). Left out: none.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
                description: >-
                  The facet’s ID, which a module’s `facets` name, e.g. `product`
                  or `topic`. Lowercase letters, digits and `-`, starting with a
                  letter, at most 64 characters; unique in its list.
              label:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                description: >-
                  The facet’s name in the editor, e.g. `Product`. One text for
                  every language, or one per language by language tag (`{ en:
                  Task, de: Handlung }`), the source language’s among them; a
                  language without its own shows the source language’s.
              values:
                minItems: 1
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 64
                      pattern: ^[a-z][a-z0-9-]*$
                      description: >-
                        The value’s ID, which a module’s `facets` give for this
                        facet, e.g. `north`. Lowercase letters, digits and `-`,
                        starting with a letter, at most 64 characters; unique in
                        its list.
                    label:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: object
                          additionalProperties:
                            type: string
                            minLength: 1
                      description: >-
                        The value’s name in the editor, e.g. `North series`. One
                        text for every language, or one per language by language
                        tag (`{ en: Task, de: Handlung }`), the source
                        language’s among them; a language without its own shows
                        the source language’s.
                  required:
                    - id
                    - label
                  additionalProperties: false
                description: >-
                  The values a module can be classified with in this facet, at
                  least one, each `{ id, label }`.
            required:
              - id
              - label
              - values
            additionalProperties: false
        variantAttributes:
          default: []
          description: >-
            The attributes content varies by, each `{ id, label, kind }`, e.g. a
            model or a software version. `variant` blocks and `when:` conditions
            test them, and each manual lists the combinations it ships. Left
            out: content does not vary.
          type: array
          items:
            $ref: '#/components/schemas/VariantAttribute'
        textAttributes:
          default: []
          description: >-
            Named text values that content uses inline (`{product-name}`), each
            `{ id, label }`; each manual sets their values, per variant where
            they differ. Left out: none.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
                description: >-
                  The text attribute’s ID, which text refers to as `{id}`, e.g.
                  `{product-name}`. `empty` is reserved. Lowercase letters,
                  digits and `-`, starting with a letter, at most 64 characters;
                  unique in its list.
              label:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                description: >-
                  The text attribute’s name in the editor, e.g. `Product name`.
                  One text for every language, or one per language by language
                  tag (`{ en: Task, de: Handlung }`), the source language’s
                  among them; a language without its own shows the source
                  language’s.
            required:
              - id
              - label
            additionalProperties: false
        safetySymbols:
          default: []
          description: >-
            The pictograms safety messages may show, each `{ id, label }`. A
            symbol without artwork prints as a placeholder in the PDF and is
            left out of the web page. Left out: none.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
                description: >-
                  The symbol’s ID, which a safety message’s `symbols` name; its
                  artwork is `symbols/<id>.svg` or `symbols/<id>.png` in the
                  content repository, e.g. `hot-surface`. Lowercase letters,
                  digits and `-`, starting with a letter, at most 64 characters;
                  unique in its list.
              label:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                description: >-
                  The symbol’s name in the editor, and its alternative text in
                  outputs, e.g. `Hot surface`. One text for every language, or
                  one per language by language tag (`{ en: Task, de: Handlung
                  }`), the source language’s among them; a language without its
                  own shows the source language’s.
            required:
              - id
              - label
            additionalProperties: false
        calloutStyles:
          description: >-
            The marker styles an image callout may use besides the default, each
            `{ id, label }`, e.g. a square for parts to remove. A callout
            without a style is a filled circle with its number. Left out: none.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
                description: >-
                  The style’s ID, which an image callout names in its `style`,
                  e.g. `remove`. Lowercase letters, digits and `-`, starting
                  with a letter, at most 64 characters; unique in its list.
              label:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                description: >-
                  The style’s name in the editor, e.g. `Part to remove`. One
                  text for every language, or one per language by language tag
                  (`{ en: Task, de: Handlung }`), the source language’s among
                  them; a language without its own shows the source language’s.
            required:
              - id
              - label
            additionalProperties: false
        translations:
          description: >-
            Per target language, what its labels were translated from: `{
            sourceCommit, blocks }`, `blocks` the source hash of each label
            (`moduleTypes.<id>`, `facets.<id>.<value>`, …) its translation was
            made from. Written by a translation import and by marking a
            translation current; left out: no record.
          type: object
          additionalProperties:
            type: object
            properties:
              sourceCommit:
                type: string
                pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
                description: The full ID of the commit whose labels were translated.
              blocks:
                type: object
                additionalProperties:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                  description: >-
                    The SHA-256 of the source-language label the translation was
                    made from.
                description: >-
                  Per label (`moduleTypes.<id>`, `facets.<id>.<value>`, …), the
                  source hash its translation was made from.
            required:
              - sourceCommit
              - blocks
            additionalProperties: false
            description: One target language’s record.
        outputLabels:
          default: {}
          description: >-
            The fixed texts outputs print around the content (signal words,
            admonition captions, the contents title, …), per manual language,
            each replacing the shipped default. The manual’s language decides
            them, never the reader’s. Left out: the shipped defaults.
          type: object
          additionalProperties:
            type: object
            properties:
              danger:
                description: >-
                  The signal word of a `danger` safety message, e.g. `DANGER`.
                  Without it: the label of the base language (`pt` for `pt-BR`),
                  then the shipped default (English, German, French, Arabic and
                  Hebrew ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              warning:
                description: >-
                  The signal word of a `warning` safety message, e.g. `WARNING`.
                  Without it: the label of the base language (`pt` for `pt-BR`),
                  then the shipped default (English, German, French, Arabic and
                  Hebrew ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              caution:
                description: >-
                  The signal word of a `caution` safety message, e.g. `CAUTION`.
                  Without it: the label of the base language (`pt` for `pt-BR`),
                  then the shipped default (English, German, French, Arabic and
                  Hebrew ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              notice:
                description: >-
                  The signal word of a `notice` safety message, e.g. `NOTICE`.
                  Without it: the label of the base language (`pt` for `pt-BR`),
                  then the shipped default (English, German, French, Arabic and
                  Hebrew ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              note:
                description: >-
                  The caption of a `note` admonition, e.g. `Note`. Without it:
                  the label of the base language (`pt` for `pt-BR`), then the
                  shipped default (English, German, French, Arabic and Hebrew
                  ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              tip:
                description: >-
                  The caption of a `tip` admonition, e.g. `Tip`. Without it: the
                  label of the base language (`pt` for `pt-BR`), then the
                  shipped default (English, German, French, Arabic and Hebrew
                  ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              important:
                description: >-
                  The caption of an `important` admonition, e.g. `Important`.
                  Without it: the label of the base language (`pt` for `pt-BR`),
                  then the shipped default (English, German, French, Arabic and
                  Hebrew ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              contents:
                description: >-
                  The title of the table of contents, e.g. `Contents`. Without
                  it: the label of the base language (`pt` for `pt-BR`), then
                  the shipped default (English, German, French, Arabic and
                  Hebrew ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              figure:
                description: >-
                  The word before a figure’s number in its caption, e.g.
                  `Figure`. Without it: the label of the base language (`pt` for
                  `pt-BR`), then the shipped default (English, German, French,
                  Arabic and Hebrew ship one), else English, reported as
                  `missing-label`.
                type: string
                minLength: 1
              table:
                description: >-
                  The word before a table’s number in its caption, e.g. `Table`.
                  Without it: the label of the base language (`pt` for `pt-BR`),
                  then the shipped default (English, German, French, Arabic and
                  Hebrew ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              unconverted:
                description: >-
                  The caption of content an import could not convert (a
                  passthrough block), e.g. `Unconverted content`. Without it:
                  the label of the base language (`pt` for `pt-BR`), then the
                  shipped default (English, German, French, Arabic and Hebrew
                  ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              attachment:
                description: >-
                  The label in front of an attached file’s name, e.g.
                  `Attachment`. Without it: the label of the base language (`pt`
                  for `pt-BR`), then the shipped default (English, German,
                  French, Arabic and Hebrew ship one), else English, reported as
                  `missing-label`.
                type: string
                minLength: 1
              attachmentNote:
                description: >-
                  The note the PDF prints with an attached file, which a reader
                  downloads from the online version, e.g. `Download the file
                  from the online version of this document.`. Without it: the
                  label of the base language (`pt` for `pt-BR`), then the
                  shipped default (English, German, French, Arabic and Hebrew
                  ship one), else English, reported as `missing-label`.
                type: string
                minLength: 1
              glossary:
                description: >-
                  The title of the glossary that ends a manual whose manifest
                  sets `glossary: true`, e.g. `Glossary`. Without it: the label
                  of the base language (`pt` for `pt-BR`), then the shipped
                  default (English, German, French, Arabic and Hebrew ship one),
                  else English, reported as `missing-label`.
                type: string
                minLength: 1
            additionalProperties: false
            description: >-
              One language’s labels, by language tag (`pt-BR`; `pt` also fills
              what a `pt-…` set leaves out): any of the keys below.
        maxHeadingLevel:
          default: 3
          description: >-
            The deepest heading level the editor offers, 1 to 5: Heading 1 is a
            section at the top of a module, Heading 2 a section inside it, and
            so on. Modules stored with deeper sections stay valid. Left out: 3.
          type: integer
          minimum: 1
          maximum: 5
        codeLanguages:
          default: []
          description: >-
            Languages the editor offers for a code block besides the ones it
            ships, each `{ id, label }`. Left out: only the shipped ones.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 32
                pattern: ^[A-Za-z0-9][A-Za-z0-9+#._-]*$
                description: >-
                  The language word a code block stores, one word of letters,
                  digits and `+ # . _ -`, at most 32 characters, e.g. `fortran`
                  or `c++`. An ID the editor already ships replaces its label.
              label:
                type: string
                minLength: 1
                description: The language’s name in the editor’s picker, e.g. `Fortran`.
            required:
              - id
              - label
            additionalProperties: false
        release:
          description: 'How releases are cut. Left out: every default.'
          type: object
          properties:
            productFacet:
              description: >-
                The ID of the facet whose values are the products a release is
                cut for (a release is a product at a revision), e.g. `product`;
                it must name a configured facet. Left out: the first facet.
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
            checkManufacturer:
              description: >-
                `true`: every manual’s checks warn (`missing-manufacturer`)
                while `manufacturer` is not set, so no manual is released
                without its imprint. Left out: `false`.
              type: boolean
          additionalProperties: false
        manufacturer:
          description: >-
            The manufacturer’s details for the imprint: a page design’s back
            page prints them, and its `manufacturer-name`,
            `manufacturer-address`, `manufacturer-contact` and
            `manufacturer-website` placeholders show them on any page. Left out:
            none (with `release.checkManufacturer`, every manual’s checks warn).
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
              pattern: ^\S(?:[^\n\r]*\S)?$
              description: >-
                The manufacturer’s name as printed, one line, at most 200
                characters, e.g. `Example Works Ltd`.
            address:
              default: []
              description: >-
                The postal address, one entry per printed line, at most 10
                lines, e.g. `[1 Sample Street, 12345 Sample Town]`. Left out:
                none.
              maxItems: 10
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 200
                pattern: ^\S(?:[^\n\r]*\S)?$
            contact:
              description: >-
                How to reach the manufacturer, one line, e.g. `info@example.com
                · +1 555 0100`. Left out: none.
              type: string
              minLength: 1
              maxLength: 200
              pattern: ^\S(?:[^\n\r]*\S)?$
            website:
              description: >-
                The manufacturer’s website, an absolute `https:` or `http:`
                address (or a `mailto:` one), e.g. `https://example.com`. Left
                out: none.
              type: string
              maxLength: 2000
              format: uri
          required:
            - name
            - address
          additionalProperties: false
        styleGuide:
          description: >-
            The house style in plain words (e.g. “Address the reader as you. One
            instruction per step.”), at most 20,000 characters. The model-based
            style review sends it with a module’s text when an author asks for
            one. Left out: the review has no house style to check against.
          type: string
          minLength: 1
          maxLength: 20000
        terminology:
          description: >-
            How the terminology checks weigh what they find: forbidden variants
            of approved terms and the variants of deprecated terms, matched in
            each module’s language without case, as whole words. Left out: every
            default.
          type: object
          properties:
            forbiddenIsBlocking:
              default: false
              description: >-
                `true`: a forbidden variant of an approved term in a module’s
                text is a blocking check (`forbidden-term`), which holds up
                review and release until it is replaced. Left out: `false`, a
                warning. A variant of a deprecated term is always a warning.
              type: boolean
          required:
            - forbiddenIsBlocking
          additionalProperties: false
        styleRules:
          description: >-
            The house style as rules, per language: phrases and patterns the
            checks before review and release, the CLI check (`check-content`)
            and the editor report in each module’s text, with their message and
            fix, and the longest sentence. Only translatable text is read (never
            code, literal or passthrough blocks). Left out: no style rules.
          type: object
          additionalProperties:
            type: object
            properties:
              maxSentenceWords:
                description: >-
                  The most words a sentence may have, 5 to 200, e.g. `25`: a
                  longer one is a `style-rule` warning. A sentence ends at `.`,
                  `!`, `?` or `…` before white space, or at a line break. Left
                  out: sentences of any length.
                type: integer
                minimum: 5
                maximum: 200
              rules:
                default: []
                description: >-
                  The language’s rules, at most 200, each a `style-rule` check
                  where it matches. Left out: none.
                maxItems: 200
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 64
                      pattern: ^[a-z][a-z0-9-]*$
                      description: >-
                        The rule’s ID, which its findings name, e.g.
                        `in-order-to`. Lowercase letters, digits and `-`,
                        starting with a letter, at most 64 characters; unique in
                        its language.
                    words:
                      description: >-
                        A phrase to find, at most 200 characters, e.g. `in order
                        to`: matched as whole words, without case (unless
                        `matchCase`), any white space between its words alike.
                        Give `words` or `pattern`, not both.
                      type: string
                      minLength: 1
                      maxLength: 200
                      pattern: ^\S(?:[^\n\r]*\S)?$
                    pattern:
                      description: >-
                        A pattern to find, at most 200 characters, e.g.
                        `\butili[sz]e\b`, matched without case (unless
                        `matchCase`) in linear time, never by backtracking:
                        characters, `.`, classes (`[a-z]`, `[^…]`, `\d`, `\w`
                        (letters, digits, marks and `_` of any script), `\s` and
                        their negations), groups (`(…)`, `(?:…)`), `|`, `?`,
                        `*`, `+`, counts up to 20 (`{2}`, `{1,3}`), `^`, `$` and
                        `\b`, `\B`. No back-references, lookaround or lazy
                        repetition; a pattern matching empty text, or of more
                        than 300 states once its counts are written out, is
                        refused. Each match is the longest from where it starts,
                        matches never overlap. Give `words` or `pattern`, not
                        both.
                      type: string
                      minLength: 1
                      maxLength: 200
                    matchCase:
                      description: >-
                        `true`: `words` or `pattern` match only in the case
                        written. Left out: `false`, any case.
                      type: boolean
                    message:
                      type: string
                      minLength: 1
                      maxLength: 500
                      pattern: ^\S(?:[^\n\r]*\S)?$
                      description: >-
                        What the writer is told, in the language the rule is
                        for, at most 500 characters, e.g. `Write “to”.`
                    replacement:
                      description: >-
                        What to write instead, offered as the fix, e.g. `to`;
                        empty: delete what was found. For `words` without
                        `matchCase`, written in the case found (a capital first,
                        or all capitals). Left out: no fix is offered.
                      type: string
                      maxLength: 200
                      pattern: ^[^\n\r]*$
                    severity:
                      description: >-
                        `warning`, worth a look, or `blocking`, which holds up
                        review and release until it is fixed. Left out:
                        `warning`.
                      type: string
                      enum:
                        - warning
                        - blocking
                  required:
                    - id
                    - message
                  additionalProperties: false
                  description: 'One rule: a phrase or a pattern, and its message.'
            required:
              - rules
            additionalProperties: false
            description: >-
              One language’s style rules, by language tag, e.g. `en`; it must be
              a configured language.
        pdf:
          default:
            standard: ua-1
          description: 'How manuals are made as PDF. Left out: every default.'
          type: object
          properties:
            standard:
              default: ua-1
              description: >-
                The standard every manual’s PDF is made to: `ua-1`, PDF/UA-1,
                tagged and accessible (a document that cannot meet it is
                refused), or `none`, a plain PDF. Left out: `ua-1`.
              type: string
              enum:
                - ua-1
                - none
            design:
              description: >-
                The page design of every manual whose manifest names none, by
                its ID: the file `design/<id>.yaml` in the content repository,
                e.g. `classic-a4`. Left out: the built-in design.
              type: string
              maxLength: 100
              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            calloutLabelMinSize:
              description: >-
                The smallest text size, in points, that a callout legend beside
                its image shrinks to before what still does not fit is cut off
                and reported, 4 to 12, e.g. `7.5`. Left out: 6.
              type: number
              minimum: 4
              maximum: 12
          required:
            - standard
          additionalProperties: false
        delivery:
          default:
            access: signed-in
            missingLanguage: picker
            pdfQrCode: none
            manuals: {}
          description: >-
            The stable addresses that open a product’s latest released manual,
            for links and QR codes. Left out: every default.
          type: object
          properties:
            access:
              default: signed-in
              description: >-
                Who may open a manual’s stable address
                (`/d/<product>/<manual>/<variant>/<lang>`, the latest release’s
                manual): `public`, anyone without signing in; `signed-in`, a
                signed-in reader allowed to read content; or `off`, nobody. The
                installation may cap it to less. Left out: `signed-in`.
              type: string
              enum:
                - public
                - signed-in
                - 'off'
            publicAudience:
              description: >-
                The most restricted audience level a public address shows, by
                its ID, e.g. `operator`; it must name a configured audience.
                Left out: the first, least restricted level.
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
            missingLanguage:
              default: picker
              description: >-
                What an address in a language the release does not have opens:
                `picker`, a page listing the languages it has, or `source`, the
                manual in the source language. Left out: `picker`.
              type: string
              enum:
                - picker
                - source
            pdfQrCode:
              default: none
              description: >-
                Where a release’s PDF prints the QR code of its stable address:
                `none`, on the `title-page`, or on a `back-cover` page of its
                own at the end. Printed only when the addresses are `public`
                (after the installation’s cap) and the installation’s public URL
                is set. Left out: `none`.
              type: string
              enum:
                - none
                - title-page
                - back-cover
            manuals:
              default: {}
              description: >-
                Per manual ID, its address segment and its former ones. Left
                out: every manual is addressed by its ID.
              type: object
              additionalProperties:
                type: object
                properties:
                  slug:
                    description: >-
                      The manual’s segment in its address, a lowercase slug,
                      e.g. `operating` in `/d/north/operating/…`; no two manuals
                      share one. Left out: the manual’s ID.
                    type: string
                    maxLength: 100
                    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  formerly:
                    default: []
                    description: >-
                      Segments the manual had before, at most 20, e.g.
                      `[user-guide]`: an address with one leads to the current
                      one, and a release made before the rename holds the manual
                      under it. None may be another manual’s address. Left out:
                      none.
                    maxItems: 20
                    type: array
                    items:
                      type: string
                      maxLength: 100
                      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                required:
                  - formerly
                additionalProperties: false
                description: >-
                  One manual’s address, by the manual’s ID, e.g.
                  `operating-manual`.
          required:
            - access
            - missingLanguage
            - pdfQrCode
            - manuals
          additionalProperties: false
        iirds:
          description: >-
            The iiRDS export: how module types, audiences, facets and variant
            attributes map to the iiRDS vocabulary, by the standard’s names.
            Left out: releases are not exported as iiRDS packages.
          type: object
          properties:
            baseIri:
              type: string
              description: >-
                Where the package’s own IRIs are made
                (`<baseIri>releases/<release>/…`, `<baseIri>modules/<module>`):
                an absolute `http` or `https` IRI ending in `/`, without query,
                fragment or user information, at most 200 characters, e.g.
                `https://docs.example.com/iirds/`.
            documentTypes:
              minItems: 1
              maxItems: 20
              type: array
              items:
                type: string
                enum:
                  - AdministratorGuide
                  - AssemblyInstructions
                  - BillOfMaterials
                  - CEDeclarationOfConformity
                  - Certificate
                  - ContractualDocument
                  - ElectronicIdentificationPlate
                  - IdentificationDocument
                  - InstallationInstructions
                  - MaintenanceInstructions
                  - OperatingInstructions
                  - PartsCatalog
                  - Plan
                  - QuickGuide
                  - RepairInstructions
                  - SafetyInstructions
                  - SalesCatalog
                  - Specification
                  - TechnicalDrawingDiagram
                  - TransportInstructions
              description: >-
                The document types of every manual, at least one as iiRDS
                requires, no repeats, e.g. `[OperatingInstructions]`; a manual
                listed in `manualDocumentTypes` takes its own instead.
            manualDocumentTypes:
              default: {}
              description: >-
                Per manual ID, document types replacing `documentTypes` for that
                manual. At most 1,000 manuals. Left out: every manual has
                `documentTypes`.
              type: object
              additionalProperties:
                minItems: 1
                maxItems: 20
                type: array
                items:
                  type: string
                  enum:
                    - AdministratorGuide
                    - AssemblyInstructions
                    - BillOfMaterials
                    - CEDeclarationOfConformity
                    - Certificate
                    - ContractualDocument
                    - ElectronicIdentificationPlate
                    - IdentificationDocument
                    - InstallationInstructions
                    - MaintenanceInstructions
                    - OperatingInstructions
                    - PartsCatalog
                    - Plan
                    - QuickGuide
                    - RepairInstructions
                    - SafetyInstructions
                    - SalesCatalog
                    - Specification
                    - TechnicalDrawingDiagram
                    - TransportInstructions
                description: >-
                  One manual’s document types, by the manual’s ID, e.g.
                  `service-manual: [MaintenanceInstructions]`.
            moduleTypes:
              default: {}
              description: >-
                Per module type ID, the iiRDS topic type and information
                subjects of its modules. One the mapping leaves out has no such
                metadata in the package, and the export warns.
              type: object
              additionalProperties:
                anyOf:
                  - type: string
                    enum:
                      - GenericConcept
                      - GenericForm
                      - GenericLearning
                      - GenericReference
                      - GenericTask
                      - GenericTroubleshooting
                  - type: object
                    properties:
                      topicType:
                        description: >-
                          The topic type its modules are, e.g. `GenericConcept`.
                          Left out: the package names none for them.
                        type: string
                        enum:
                          - GenericConcept
                          - GenericForm
                          - GenericLearning
                          - GenericReference
                          - GenericTask
                          - GenericTroubleshooting
                      subjects:
                        description: >-
                          The information subjects its modules are about, at
                          least one, no repeats, e.g. `[SafetyInstruction]`.
                          Left out: none.
                        minItems: 1
                        maxItems: 31
                        type: array
                        items:
                          type: string
                          enum:
                            - ApplicableStandards
                            - Caution
                            - ContactInformation
                            - Danger
                            - DeclarationOfConformity
                            - ForeseeableMisuse
                            - GenericCollection
                            - GenericConformity
                            - GenericFormality
                            - GenericFunctionality
                            - GenericProcess
                            - GenericSafety
                            - GenericTechnicalData
                            - GenericTechnicalOverview
                            - GenericWarningMessage
                            - IntendedUse
                            - LegalInformation
                            - LicenceTerm
                            - ManufacturerInformation
                            - Notice
                            - OperatingElement
                            - ProductIdentification
                            - ProductName
                            - RestrictionOnUse
                            - RiskAssessment
                            - SafetyInstruction
                            - ScopeOfDelivery
                            - Symbol
                            - TechnicalReport
                            - WarrantyConditions
                            - Warning
                    additionalProperties: false
                description: >-
                  One module type’s mapping, by the module type’s ID: its topic
                  type alone (`task: GenericTask`), or `{ topicType, subjects }`
                  with either or both (`safety: { topicType: GenericConcept,
                  subjects: [SafetyInstruction] }`).
            audiences:
              default: {}
              description: >-
                Per audience level ID, the qualification class it is: `Role` or
                `SkillLevel`, e.g. `{ operator: Role }`. One the mapping leaves
                out has no such metadata in the package, and the export warns.
              type: object
              additionalProperties:
                type: string
                enum:
                  - Role
                  - SkillLevel
            facets:
              default: {}
              description: >-
                Per facet ID, the product metadata class its values are:
                `ProductVariant`, `Component`, `ProductFunction` or
                `ProductProperty`, e.g. `{ region: ProductVariant }`. One the
                mapping leaves out has no such metadata in the package, and the
                export warns.
              type: object
              additionalProperties:
                type: string
                enum:
                  - ProductVariant
                  - Component
                  - ProductFunction
                  - ProductProperty
            variantAttributes:
              default: {}
              description: >-
                Per variant attribute ID, the product metadata class its values
                are, as for `facets`, e.g. `{ model: ProductVariant }`. One the
                mapping leaves out has no such metadata in the package, and the
                export warns.
              type: object
              additionalProperties:
                type: string
                enum:
                  - ProductVariant
                  - Component
                  - ProductFunction
                  - ProductProperty
            lifecyclePhases:
              description: >-
                A facet whose values are product lifecycle phases, and the phase
                each value is. Left out: the package names no lifecycle phases.
              type: object
              properties:
                facet:
                  type: string
                  maxLength: 64
                  pattern: ^[a-z][a-z0-9-]*$
                  description: >-
                    The ID of the facet whose values are lifecycle phases, e.g.
                    `phase`; it must not also be in `facets`.
                values:
                  type: object
                  additionalProperties:
                    type: string
                    enum:
                      - Acquisition
                      - Configuration
                      - Decommissioning
                      - Design
                      - Development
                      - Diagnostics
                      - Disposal
                      - EmergencyOperation
                      - Fault
                      - GenericAfterUse
                      - GenericDesignAndRealization
                      - GenericPuttingToUse
                      - GenericUse
                      - Installation
                      - Maintenance
                      - Operation
                      - Production
                      - Repair
                      - RequirementsAnalysis
                  description: >-
                    Per value ID of that facet, the lifecycle phase it is, e.g.
                    `{ use: Operation }`. A value left out has no phase, and the
                    export warns.
              required:
                - facet
                - values
              additionalProperties: false
          required:
            - baseIri
            - documentTypes
            - manualDocumentTypes
            - moduleTypes
            - audiences
            - facets
            - variantAttributes
          additionalProperties: false
        dita:
          description: >-
            The DITA 1.3 import: which topic types, output classes, profiling
            attributes, keys and hazard symbols become which module types,
            variant attributes, audience levels, text attributes and safety
            symbols. Keys are DITA names, values the project’s IDs. Left out:
            the import’s defaults (names matched by the same IDs).
          type: object
          properties:
            moduleTypes:
              default: {}
              description: >-
                Per topic type (a topic’s root element: `concept`, `task`, … or
                a specialisation’s), the module type its topics become, e.g. `{
                task: procedure }`. Keys are DITA names (one token, no
                whitespace or parentheses), at most 1,000 entries. Left out, or
                a name not listed: a configured module type named like the topic
                type, else `defaultModuleType`.
              type: object
              additionalProperties:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
            outputclasses:
              default: {}
              description: >-
                Per token of a topic’s `@outputclass`, the module type its
                topics become; it wins over `moduleTypes`, e.g. `{ howto:
                procedure }`. Keys are DITA names (one token, no whitespace or
                parentheses), at most 1,000 entries. Left out, or a name not
                listed: `moduleTypes` decides.
              type: object
              additionalProperties:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
            defaultModuleType:
              description: >-
                The module type, by ID, of a topic whose type neither
                `outputclasses`, `moduleTypes` nor a configured module type of
                the same name gives, e.g. `concept`. Left out: the first
                configured module type.
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
            profiling:
              default: {}
              description: >-
                Per profiling attribute (or a group name inside one,
                `product="unit(basic)"`), what its values become, e.g. `{
                product: { variantAttribute: model } }`. Keys are DITA names
                (one token, no whitespace or parentheses), at most 1,000
                entries. Left out, or a name not listed: a profiling attribute
                named like a variant attribute maps to it, and `audience` to the
                audience levels of the same IDs.
              type: object
              additionalProperties:
                anyOf:
                  - type: object
                    properties:
                      variantAttribute:
                        type: string
                        maxLength: 64
                        pattern: ^[a-z][a-z0-9-]*$
                        description: >-
                          The ID of the variant attribute the profiling
                          attribute’s values become, e.g. `model`.
                      values:
                        description: >-
                          Per DITA value, the variant attribute’s value it
                          becomes, e.g. `{ basic-unit: basic }`. Left out, or a
                          DITA value not listed: the value of the same ID.
                        type: object
                        additionalProperties:
                          type: string
                          minLength: 1
                          maxLength: 100
                    required:
                      - variantAttribute
                    additionalProperties: false
                  - type: object
                    properties:
                      audience:
                        type: object
                        additionalProperties:
                          type: string
                          maxLength: 64
                          pattern: ^[a-z][a-z0-9-]*$
                        description: >-
                          Per DITA value, the audience level’s ID it becomes,
                          e.g. `{ user: operator }`. It applies only where a
                          module or a manual entry starts.
                    required:
                      - audience
                    additionalProperties: false
                description: >-
                  What one profiling attribute’s values become: a variant
                  attribute’s values (`{ variantAttribute, values }`) or
                  audience levels (`{ audience }`).
            textKeys:
              default: {}
              description: >-
                Per key that holds text (`<keydef keys="…">` with a
                `<keyword>`), the text attribute an empty `<ph keyref="…"/>`
                becomes, e.g. `{ prodname: product-name }`. Keys are DITA names
                (one token, no whitespace or parentheses), at most 1,000
                entries. Left out, or a name not listed: a text attribute named
                like the key, if there is one; any other key is imported as its
                text.
              type: object
              additionalProperties:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
            hazardSymbols:
              default: {}
              description: >-
                Per `<hazardsymbol>` file name (its `@href`’s last segment) or
                key, the safety symbol it becomes, e.g. `{ hot-surface.svg:
                hot-surface }`. Keys are DITA names (one token, no whitespace or
                parentheses), at most 1,000 entries. Left out, or a name not
                listed: the symbol is left out, and the import reports it.
              type: object
              additionalProperties:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
            ditavalDefault:
              default: none
              description: >-
                What becomes of a DITAVAL file no map names: `none`, it is not
                applied (and reported), or `all`, it becomes a variant of every
                manual. Left out: `none`.
              type: string
              enum:
                - none
                - all
          required:
            - moduleTypes
            - outputclasses
            - profiling
            - textKeys
            - hazardSymbols
            - ditavalDefault
          additionalProperties: false
      required:
        - languages
        - moduleTypes
        - audiences
        - facets
        - variantAttributes
        - textAttributes
        - safetySymbols
        - outputLabels
        - maxHeadingLevel
        - codeLanguages
        - pdf
        - delivery
      additionalProperties: false
    VariantAttribute:
      oneOf:
        - type: object
          properties:
            id:
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
              description: >-
                The variant attribute’s ID, which `variant` blocks, `when:`
                conditions and a manual’s variants name, e.g. `model` or
                `software`. Lowercase letters, digits and `-`, starting with a
                letter, at most 64 characters; unique in its list.
            label:
              anyOf:
                - type: string
                  minLength: 1
                - type: object
                  additionalProperties:
                    type: string
                    minLength: 1
              description: >-
                The variant attribute’s name in the editor and where a variant
                is named, e.g. `Model` (a version shows as `Software 2.1`). One
                text for every language, or one per language by language tag (`{
                en: Task, de: Handlung }`), the source language’s among them; a
                language without its own shows the source language’s.
            kind:
              type: string
              enum:
                - enum
              description: >-
                How the attribute’s values are compared: `enum`, one of a fixed
                list of values (`values`, e.g. a model or a market), or
                `version`, a dotted version compared numerically (`2.10` is
                after `2.9`, e.g. a software version), which lists no values.
            values:
              minItems: 1
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 64
                    pattern: ^[a-z][a-z0-9-]*$
                    description: >-
                      The value’s ID, which conditions compare with, e.g.
                      `large` in `when: model = large`. Lowercase letters,
                      digits and `-`, starting with a letter, at most 64
                      characters; unique in its list.
                  label:
                    anyOf:
                      - type: string
                        minLength: 1
                      - type: object
                        additionalProperties:
                          type: string
                          minLength: 1
                    description: >-
                      The value’s name in the editor and where a variant is
                      named, e.g. `Large`. One text for every language, or one
                      per language by language tag (`{ en: Task, de: Handlung
                      }`), the source language’s among them; a language without
                      its own shows the source language’s.
                  archived:
                    description: >-
                      `true` retires the value: content that uses it stays
                      valid, but the editor no longer offers it. Removing a
                      value that content still uses is refused, so archiving is
                      the way to retire one. Left out: the value is offered.
                    type: boolean
                required:
                  - id
                  - label
                additionalProperties: false
              description: >-
                For `kind: enum` only: the values the attribute can take, at
                least one, each `{ id, label }`.
          required:
            - id
            - label
            - kind
            - values
          additionalProperties: false
        - type: object
          properties:
            id:
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
              description: >-
                The variant attribute’s ID, which `variant` blocks, `when:`
                conditions and a manual’s variants name, e.g. `model` or
                `software`. Lowercase letters, digits and `-`, starting with a
                letter, at most 64 characters; unique in its list.
            label:
              anyOf:
                - type: string
                  minLength: 1
                - type: object
                  additionalProperties:
                    type: string
                    minLength: 1
              description: >-
                The variant attribute’s name in the editor and where a variant
                is named, e.g. `Model` (a version shows as `Software 2.1`). One
                text for every language, or one per language by language tag (`{
                en: Task, de: Handlung }`), the source language’s among them; a
                language without its own shows the source language’s.
            kind:
              type: string
              enum:
                - version
              description: >-
                How the attribute’s values are compared: `enum`, one of a fixed
                list of values (`values`, e.g. a model or a market), or
                `version`, a dotted version compared numerically (`2.10` is
                after `2.9`, e.g. a software version), which lists no values.
          required:
            - id
            - label
            - kind
          additionalProperties: false
    IirdsMappingIssue:
      type: object
      properties:
        code:
          type: string
          enum:
            - unmapped-module-type
            - unmapped-audience
            - unmapped-facet
            - unmapped-variant-attribute
            - unmapped-lifecycle-phase
            - unknown-mapping-key
          description: >-
            Stable. `unmapped-*`: a value the configuration defines that the
            iiRDS mapping names no class for (an iiRDS package leaves that
            metadata out, with a warning); `unknown-mapping-key`: a key of the
            mapping naming nothing the configuration defines (ignored).
        path:
          type: string
          description: Where in `iirds`, e.g. `moduleTypes.task`.
        message:
          type: string
      required:
        - code
        - path
        - message
      additionalProperties: false
    DitaMappingIssue:
      type: object
      properties:
        code:
          type: string
          enum:
            - unknown-module-type
            - unknown-variant-attribute
            - unknown-variant-value
            - unknown-audience
            - unknown-text-attribute
            - unknown-safety-symbol
          description: >-
            Stable: the value of the DITA mapping names no module type, variant
            attribute, variant value, audience level, text attribute or safety
            symbol of the configuration. A DITA import uses its default there
            and reports it.
        path:
          type: string
          description: Where in `dita`, e.g. `moduleTypes.task`.
        message:
          type: string
      required:
        - code
        - path
        - message
      additionalProperties: false
    LanguageDirectionIssue:
      type: object
      properties:
        code:
          type: string
          enum:
            - unknown-direction-language
          description: >-
