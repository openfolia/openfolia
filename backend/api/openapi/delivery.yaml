  /modules/{lang}/{id}/compare:
    get:
      description: >-
        The module at both versions and how it changed, block by block, in the
        shape of a change set’s changes (`meta.change`, `meta.fields`,
        `meta.blocks`), so the review screen’s diff renders it. Each side is
        read as reading its commit needs: a released commit (`main`’s head, a
        release tag) with `content.read`, any other, also an older commit of
        `main`, with `content.read.draft`, else 404 as for a ref that does not
        exist. Each side shows the module only as the reader would see it on the
        other too; a side where it is not there is `added` or `removed`; 404
        when neither has it.
      operationId: ModuleCompare_compareVersions
      parameters:
        - name: lang
          required: true
          in: path
          schema:
            type: string
            minLength: 1
            maxLength: 64
            example: en
        - name: id
          required: true
          in: path
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            example: battery-charging
        - name: base
          required: true
          in: query
          description: 'The older version: a commit ID or a tag.'
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: head
          required: true
          in: query
          description: 'The newer version: a commit ID or a tag.'
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ModuleComparisonDocument'
        '400':
          description: '`invalid-parameter`: `base` or `head` is missing or given twice.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            A side names no commit the reader may open, or the module is on
            neither side.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            A file needed for the answer is broken (the configuration);
            `meta.path` names it.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
