  /manuals/{id}/variants/{variant}/{lang}/pdf:
    get:
      description: >-
        The resolved manual typeset with the repository's template (or the
        built-in one), tagged and conforming to PDF/UA-1 unless `pdf.standard`
        in `openfolia.yaml` is `none`. Cached per commit; the first request for
        a commit renders it.
      operationId: ManualPdf_pdf
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            example: operating
        - name: variant
          required: true
          in: path
          description: Variant slug as listed by `GET /manuals/{id}`, e.g. `model=large`.
          schema:
            type: string
            minLength: 1
            maxLength: 500
            description: Variant slug as listed by `GET /manuals/{id}`, e.g. `model=large`.
            example: model=large
        - name: lang
          required: true
          in: path
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
            example: en
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
            X-Ccms-Issues:
              description: How many issues resolving the manual found.
              schema:
                type: integer
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: Malformed manual ID, variant slug or language.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `invalid-content`: a file needed for the answer is broken; the
            error's `meta.path` names it. `pdf-accessibility`: the manual cannot
            meet the configured PDF standard (`pdf.standard`, PDF/UA-1 by
            default); the error's `meta.problems` has the renderer's reasons
            (`message`, `hints`). `render-timeout`: the document takes too long
            to render. `expansion-too-large`: once its module references are
            included the manual holds more than 500,000 content nodes,
            12,000,000 characters or 1,000,000 table cells (rows × columns) (a
            module referred to over several paths counts once per path), or its
            blocks and references nest more than 100 deep, so nothing of it is
            made (`meta.nodes`, `meta.chars`, `meta.tableCells`, `meta.depth`:
            the limits).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '500':
          description: >-
            Compiling failed; the error's `meta.diagnostics` has the compiler's
            messages.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            The renderer is busy or the server is shutting down; `Retry-After`
            says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
