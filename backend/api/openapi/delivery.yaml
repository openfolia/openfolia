  /releases/{releaseId}/outputs:
    get:
      description: >-
        The release’s files (#249): one PDF per manual, variant and configured
        language, rendered in the background once the release is cut (`state`),
        and one offline package (#59, `kind` `offline-package`) per configured
        language and audience level up to the highest any manual has, built once
        the PDFs are done: a ZIP of the manuals that level reads, as HTML pages
        and PDFs, that opens from the file system without a network
        (`attributes.audience`; `manual` and `variant` null). A reader sees a
        package only when one role of theirs reads its whole level in its
        language. A manual the release did not change (in that language) reuses
        the previous release’s file (`meta.reusedFrom`), so every release has a
        full set. A withdrawn release’s outputs stay readable, marked
        `meta.withdrawn`. Ordered by manual, variant, language. Needs
        `content.read` at the release’s tag, in a role that covers all of the
        output’s manual: its audience and language, with no module type or facet
        left out, and the source language too (a module not translated falls
        back to it). An output is rendered as the manual’s audience reads it,
        the same file for all of its readers, so it may hold any module the
        manual names; a reader whose scope leaves some out reads the manual’s
        PDF route instead. Others get 404, exactly like a missing one.
      operationId: ReleaseOutputs_list
      parameters:
        - name: releaseId
          required: true
          in: path
          description: >-
            The release’s ID (a UUID). One that names no release, malformed or
            not, is 404.
          schema:
            type: string
            format: uuid
        - name: filter[manual]
          required: false
          in: query
          description: Only this manual’s outputs.
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        - name: filter[lang]
          required: false
          in: query
          description: Only outputs in this language.
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        - name: filter[state]
          required: false
          in: query
          description: >-
            Only outputs in this state (`queued`, `rendering`, `done`,
            `failed`).
          schema:
            type: string
            enum:
              - queued
              - rendering
              - done
              - failed
        - name: filter[kind]
          required: false
          in: query
          description: Only outputs of this kind (`pdf`, `offline-package`).
          schema:
            type: string
            enum:
              - pdf
              - offline-package
        - name: page[number]
          required: false
          in: query
          description: 'Page to return, from 1. Default: 1.'
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          required: false
          in: query
          description: 'Resources per page. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReleaseOutputPageDocument'
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no release with this ID, or no output of it you may
            read.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: List a release’s outputs
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /releases/{releaseId}/outputs/archive:
    get:
      description: >-
        Every output of the release you may read (as `GET …/outputs` lists them)
        that is `done`, in one ZIP, its files stored as they were rendered (no
        compression: PDFs are compressed already), named
        `<manual>/<lang>/<variant>.pdf` (ASCII letters, digits, `.` and `-` per
        part, anything else `-`; a name taken already, ignoring case, gets `-2`,
        `-3`, … before the extension). `Content-Disposition: attachment` with
        `<product>_<revision>.zip`, `Content-Length` the archive's exact length.
        Streamed from the blob store one file at a time. Outputs still queued or
        rendering, or failed, are left out: `X-Ccms-Archive-Files` says how many
        files it holds, `X-Ccms-Archive-Left-Out` how many of those you may read
        are not in it. Not cached (`private, no-store`): it holds more files
        once more are done. A blob store failing once part of it went out cuts
        the connection. Needs `content.read` at the release’s tag, in a role
        that covers all of the output’s manual: its audience and language, with
        no module type or facet left out, and the source language too (a module
        not translated falls back to it). An output is rendered as the manual’s
        audience reads it, the same file for all of its readers, so it may hold
        any module the manual names; a reader whose scope leaves some out reads
        the manual’s PDF route instead. Others get 404, exactly like a missing
        one.
      operationId: ReleaseOutputFile_zip
      parameters:
        - name: releaseId
          required: true
          in: path
          description: >-
            The release’s ID (a UUID). One that names no release, malformed or
            not, is 404.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: '`attachment` with the file name.'
              schema:
                type: string
            X-Ccms-Archive-Files:
              description: How many files the archive holds.
              schema:
                type: integer
            X-Ccms-Archive-Left-Out:
              description: >-
                How many of the release’s outputs you may read are not in it:
                queued, rendering or failed.
              schema:
                type: integer
        '400':
          description: An unsupported query parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: '`not-found`: no release with this ID.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '409':
          description: >-
            `release-archive-empty`: none of the outputs you may read is done
            yet, or there are none (`meta.total`, `meta.notReady`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `release-archive-too-large`: the archive would be larger than
            `CCMS_RELEASE_ARCHIVE_MAX_BYTES` (`meta.size`, `meta.limit`, in
            bytes); download the files one by one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            `blob-store-unavailable`: the blob store does not answer;
            `Retry-After` says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Download all of a release’s files as one ZIP
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /releases/{releaseId}/outputs/{outputId}/file:
    get:
      description: >-
        The output’s file from the blob store, as it was rendered (never
        rendered on request): `Content-Disposition: attachment` with a readable
        name (`<manual>_<variant>_<lang>_<revision>.pdf`; an offline package
        `offline_<audience>_<lang>_<revision>.zip`, `application/zip`), and
        cached for good (`private, max-age=31536000, immutable`: an output’s
        file never changes). 409 `output-not-ready` until the output is `done`.
        Needs `content.read` at the release’s tag, in a role that covers all of
        the output’s manual: its audience and language, with no module type or
        facet left out, and the source language too (a module not translated
        falls back to it). An output is rendered as the manual’s audience reads
        it, the same file for all of its readers, so it may hold any module the
        manual names; a reader whose scope leaves some out reads the manual’s
        PDF route instead. Others get 404, exactly like a missing one.
      operationId: ReleaseOutputFile_file
      parameters:
        - name: releaseId
          required: true
          in: path
          description: >-
            The release’s ID (a UUID). One that names no release, malformed or
            not, is 404.
          schema:
            type: string
            format: uuid
        - name: outputId
          required: true
          in: path
          description: >-
            The output’s ID (a UUID). One that names no output of the release
            you may read, malformed or not, is 404.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'The file: a PDF, or an offline package’s ZIP.'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: '`attachment` with the file name.'
              schema:
                type: string
            ETag:
              description: The file’s SHA-256, quoted.
              schema:
                type: string
        '400':
          description: An unsupported query parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: no release with this ID, or no output of it you may
            read.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '409':
          description: '`output-not-ready`: the output is not `done` (`meta.state`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            `blob-store-unavailable`: the blob store does not answer;
            `Retry-After` says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Download a release output
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /terms/export:
    get:
      description: >-
        Every term at `?ref=`, by ID, as a download (`Content-Disposition:
        attachment`): TBX-Basic (ISO 30042:2019, DCA style; one `conceptEntry`
        per term, a `termSec` per variant with its administrative status:
        preferred, admitted, deprecated for a forbidden one, superseded for a
        deprecated term’s) or CSV (a header row, then one row per term and
        language; variants one per line in their cell; a value a spreadsheet
        would run as a formula starts with `'`). Definitions are plain text.
        Files that are no term are left out. Sent with `nosniff`; `X-Ccms-Terms`
        says how many terms it holds.
      operationId: TermExport_export
      parameters:
        - name: format
          required: true
          in: query
          description: '`tbx` or `csv`.'
          schema:
            type: string
            enum:
              - tbx
              - csv
        - name: lang
          required: false
          in: query
          description: >-
            Only this language (a language tag); a term without it is left out.
            Default: every language.
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          description: The file.
          content:
            application/x-tbx+xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
            X-Ccms-Terms:
              description: How many terms the file holds.
              schema:
                type: integer
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: >-
            `invalid-parameter`: no or an unknown `format`, or a malformed
            `lang`; `unsupported-parameter` for any other query parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `invalid-content`: a file needed for the answer is broken; the
            error's `meta.path` names it. `table-too-large`: a module file holds
            a table of more than 1,000 columns or 50,000 cells (rows × columns),
