      x-audience: delivery
      x-required-permission: content.read
  /releases/{releaseId}/dita-packages/{packageId}:
    get:
      description: >-
        Makes the package (or takes it from the last few made) and says what it
        holds: `meta.size`, `meta.languages`, `meta.topics`, `meta.media` and
        `meta.warnings`, what DITA could not say as the content does and was
        written in another form or left out (never silently). Needs
        `content.read` at the release’s tag, in a role that covers all of the
        output’s manual: its audience and language, with no module type or facet
        left out, and the source language too, as for the release’s outputs. A
        package is made as the manual’s audience reads it, the same for all of
        its readers. Others get 404, exactly like a missing one.
      operationId: DitaPackages_get
      parameters:
        - name: releaseId
          required: true
          in: path
          description: >-
            The release’s ID (a UUID). One that names no release, malformed or
            not, is 404.
          schema:
            type: string
            format: uuid
        - name: packageId
          required: true
          in: path
          description: >-
            The package’s ID: its release output’s (a UUID). One that names no
            output of the release you may read, malformed or not, is 404.
          schema:
            type: string
            format: uuid
        - name: languages
          required: false
          in: query
          description: >-
            `output` (the default): the output’s language only; `all`: every
            configured language you may read the whole manual in, each a folder.
          schema:
            type: string
            enum:
              - output
              - all
        - name: references
          required: false
          in: query
          description: >-
            `conref` (the default): a module reference is a content reference
            (`@conref`, `@conrefend`) where DITA can say one, else its content;
            `resolved`: always its content.
          schema:
            type: string
            enum:
              - conref
              - resolved
