              type: array
              items:
                $ref: '#/components/schemas/Condition'
          required:
            - op
            - of
          additionalProperties: false
        - type: object
          properties:
            op:
              type: string
              enum:
                - not
            of:
              $ref: '#/components/schemas/Condition'
          required:
            - op
            - of
          additionalProperties: false
        - type: object
          properties:
            op:
              type: string
              enum:
                - in
            attr:
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
            values:
              minItems: 1
              type: array
              items:
                type: string
                minLength: 1
          required:
            - op
            - attr
            - values
          additionalProperties: false
        - type: object
          properties:
            op:
              type: string
              enum:
                - cmp
            attr:
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
            cmp:
              type: string
              enum:
                - <
                - <=
                - '>'
                - '>='
            value:
              type: string
              pattern: ^\d+(?:\.\d+)*$
          required:
            - op
            - attr
            - cmp
            - value
          additionalProperties: false
    Issue:
      type: object
      properties:
        severity:
          type: string
          enum:
            - error
            - warning
        code:
          type: string
          description: Stable machine-readable code, e.g. `unknown-audience`.
        message:
          type: string
        at:
          description: ID of the block or item concerned; absent for metadata.
          type: string
      required:
        - severity
        - code
        - message
      additionalProperties: false
    ModuleStatus:
      type: object
      properties:
        release:
          nullable: true
          description: >-
            The newest release (tag) holding the module as the reader may see it
            there; null when none of the 50 newest does.
          type: object
          properties:
            tag:
              type: string
              description: The release tag.
            commit:
              type: string
              description: A commit ID.
            same:
              type: boolean
              description: Whether the module there is exactly the one read.
          required:
            - tag
            - commit
            - same
          additionalProperties: false
        main:
          nullable: true
          description: >-
            The module on `main` (approved content), as the reader may see it
            there; null when it is not there.
          type: object
          properties:
            commit:
              type: string
              description: A commit ID.
            same:
              type: boolean
              description: Whether the module there is exactly the one read.
          required:
            - commit
            - same
          additionalProperties: false
        changeSets:
          description: >-
            The open change sets (draft, in review or approved) changing the
            module, newest first: only those the reader may read (all of them
            with `content.read.draft`, else their own), and only where the
            reader may see the module on the change set’s head or base. Left out
            for a reader who holds neither `content.read.draft` nor
            `content.edit` (a consumer of released content).
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The change set’s ID.
              state:
                type: string
                enum:
                  - draft
                  - in-review
                  - approved
            required:
              - id
              - state
            additionalProperties: false
        deprecated:
          nullable: true
          description: >-
            The module’s deprecation at the ref read (#266), with its reason and
            replacement: its source-language file’s as the reader may see it
            (else this file’s own); null when it is not deprecated. Read on
            `main`, it says what was merged.
          allOf:
            - $ref: '#/components/schemas/Deprecation'
      required:
        - release
        - main
        - deprecated
      additionalProperties: false
      description: >-
        Where the module stands, derived from Git (never stored): released, on
        `main`, in change sets, deprecated.
    ModuleUsage:
      type: object
      properties:
        manuals:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: >-
            The manuals including the module, directly or through module
            references.
        modules:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: The modules whose module reference blocks name it.
      required:
        - manuals
        - modules
      additionalProperties: false
      description: >-
        How many manuals and modules use the module (by ID, in any language),
        from the module index; only what the reader may see counts.
    ModuleUse:
      type: object
      properties:
        kind:
          type: string
          enum:
            - manual
            - module
          description: A manual including the module, or a module referring to it.
        id:
          type: string
          description: The manual’s or the module’s ID.
        title:
          type: string
          description: >-
            Its title (a module’s in the source language, else in its first
            language).
        direct:
          type: boolean
          description: >-
            A manual: true when one of its entries names the module, false when
            it includes it only through module references. A module: always
            true.
        deprecated:
          type: boolean
          description: >-
            Whether the manual or module using it is deprecated (#266), from the
            module index: a manual by its manifest, a module by its
            source-language file.
      required:
        - kind
        - id
        - title
        - direct
        - deprecated
      additionalProperties: false
    UnreadableModuleResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - Module
        id:
          type: string
        attributes:
          type: object
          properties:
            moduleId:
              type: string
            lang:
              type: string
          required:
            - moduleId
            - lang
          additionalProperties: false
        meta:
          type: object
          properties:
            error:
              type: string
              description: Why it cannot be read.
          required:
            - error
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
      additionalProperties: false
    ModuleDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ModuleResource'
      required:
        - data
      additionalProperties: false
    ModuleVersionPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModuleVersionResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
            truncated:
              type: boolean
              description: >-
                The ref’s first-parent line goes on past the 1,000 newest
                commits looked at: older versions are not listed, and, when the
                module existed before them, versions carry no revision number.
          required:
            - page
            - truncated
          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ModuleVersionResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ModuleVersion
        id:
          type: string
        attributes:
          type: object
          properties:
            commit:
              type: string
              description: A commit ID.
            committedAt:
              type: string
              description: When it was committed (ISO 8601, the committer’s offset).
            message:
              type: string
              description: >-
                The commit message without its trailers: for a merge, the change
                set’s title and a line naming it.
            merge:
              type: boolean
              description: Whether it is a merge (a change set merged into the ref).
            actor:
              nullable: true
              description: >-
                Who made it, as the commit’s trailers claim (`Merged-by`, else
                `Actor` for a save point); null when they name no one. Recorded
                by the server for the commits it makes, but a commit pushed from
                outside can claim anything.
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - user
                    - service
                id:
                  type: string
              required:
                - kind
                - id
              additionalProperties: false
            approvedBy:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - user
                      - service
                  id:
                    type: string
                required:
                  - kind
                  - id
                additionalProperties: false
              description: >-
                Who approved it, as its `Approved-by` trailers claim, in order:
                the approvers of a merged change set.
          required:
            - commit
            - committedAt
            - message
            - merge
            - actor
            - approvedBy
          additionalProperties: false
        relationships:
          type: object
          properties:
            actor:
              type: object
              properties:
                data:
                  nullable: true
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - User
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
              description: '`actor` when it is a user the server knows; else empty.'
            changeSet:
              type: object
              properties:
                data:
                  nullable: true
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - ChangeSet
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
              description: >-
                The change set it came from (`Merged-change-set`, else
                `Change-set`); empty when its trailers name none.
            approvers:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - User
                      id:
                        type: string
                    required:
                      - type
                      - id
                    additionalProperties: false
              required:
                - data
              additionalProperties: false
              description: The users among `approvedBy` the server knows.
          required:
            - actor
            - changeSet
            - approvers
          additionalProperties: false
        meta:
          type: object
          properties:
            revision:
              nullable: true
              description: >-
                The version’s number, counted from the oldest (1): derived,
                never stored. Null when the history was cut (`meta.truncated` on
                the document) while the module already existed before the oldest
                commit looked at, as the count would not start at the first.
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            change:
              type: string
              enum:
                - added
                - changed
                - removed
              description: >-
                How the module as the reader sees it differs from the version
                before: `added` (also back after a removal), `changed`,
                `removed` (deleted, or moved out of the reader’s scope).
            releases:
              type: array
              items:
                type: object
                properties:
                  tag:
                    type: string
                  commit:
                    type: string
                    description: A commit ID.
                required:
                  - tag
                  - commit
                additionalProperties: false
              description: >-
                The release tags (of the 50 newest) whose commit holds exactly
                this file, as the reader may see it there; newest first.
            unreadable:
              type: boolean
              description: >-
                The file after this commit cannot be read (shown only to a
                reader of all of its language).
          required:
            - revision
            - change
            - releases
            - unreadable
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - relationships
        - meta
      additionalProperties: false
      description: >-
        `id` is `<lang>/<moduleId>/<commit>`. Derived from Git: nothing of it is
        stored by the server.
    ModuleComparisonDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ModuleComparisonResource'
      required:
        - data
      additionalProperties: false
    ModuleComparisonResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ModuleComparison
        id:
          type: string
        attributes:
          type: object
          properties:
            base:
              nullable: true
              description: >-
                The module at `base`, as the reader sees it on both sides; null
                when it is not there (or cannot be read: `meta.unreadable`).
              allOf:
                - $ref: '#/components/schemas/ModuleAttributes'
            head:
              nullable: true
              description: The module at `head`, likewise.
              allOf:
                - $ref: '#/components/schemas/ModuleAttributes'
          required:
            - base
            - head
          additionalProperties: false
        meta:
          type: object
          properties:
            base:
              type: string
              description: The commit `base` named.
            head:
              type: string
              description: The commit `head` named.
            change:
              type: string
              enum:
                - added
                - changed
                - removed
                - unchanged
              description: >-
                `added` (not there at `base`), `removed` (not there at `head`),
                `changed`, or `unchanged` (the same module on both sides).
            fields:
              type: array
              items:
                type: string
              description: >-
                The module’s metadata fields that differ (`title`, `type`,
                `audience`, …), as in a change set’s changes. Empty unless
                changed.
            blocks:
              type: array
              items:
                type: object
                properties:
                  blockId:
                    type: string
                  change:
                    type: string
                    enum:
                      - added
                      - changed
                      - removed
                required:
                  - blockId
                  - change
                additionalProperties: false
              description: >-
                The blocks, list items and procedure steps that differ, by ID,
                exactly as in a change set’s changes: in the head’s order, then
                the removed ones. Empty unless changed.
            unreadable:
              type: boolean
              description: >-
                A side has a file that cannot be read (shown only to a reader of
                all of its language).
          required:
            - base
            - head
            - change
            - fields
            - blocks
            - unreadable
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
      additionalProperties: false
      description: >-
        `id` is `<lang>/<moduleId>/<base commit>..<head commit>`. Derived from
        Git, never stored.
    ManifestEntry:
      anyOf:
        - type: object
          properties:
            module:
              type: string
              maxLength: 100
              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            when:
              allOf:
                - $ref: '#/components/schemas/Condition'
          required:
            - module
          additionalProperties: false
        - type: object
          properties:
            title:
              anyOf:
                - type: string
                  minLength: 1
                  pattern: ^\S(?:[^\n\r]*\S)?$
                - type: object
                  additionalProperties:
                    type: string
                    minLength: 1
                    pattern: ^\S(?:[^\n\r]*\S)?$
            when:
              allOf:
                - $ref: '#/components/schemas/Condition'
            entries:
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/ManifestEntry'
          required:
            - title
            - entries
          additionalProperties: false
    TermLanguage:
      type: object
      properties:
        preferred:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\p{Cc}]*$
        allowed:
          default: []
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/TermVariant'
        forbidden:
          default: []
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/TermVariant'
        definition:
          allOf:
            - $ref: '#/components/schemas/TermDefinition'
        usage:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: ^(?:[^\p{Cc}]|[\n\t])*$
      required:
        - preferred
        - allowed
        - forbidden
      additionalProperties: false
    TermVariant:
      type: object
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\p{Cc}]*$
        note:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^(?:[^\p{Cc}]|[\n\t])*$
      required:
        - term
      additionalProperties: false
    TermDefinition:
      minItems: 1
      maxItems: 1000
      type: array
      items:
        oneOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                  - text
              text:
                type: string
                minLength: 1
                pattern: ^[^\n\r]*$
              marks:
                type: array
                items:
                  $ref: '#/components/schemas/Mark'
            required:
              - type
              - text
            additionalProperties: false
          - type: object
            properties:
              type:
                type: string
                enum:
                  - hardBreak
            required:
              - type
            additionalProperties: false
    ManualPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/ManualResource'
              - $ref: '#/components/schemas/UnreadableManualResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
          required:
            - page
          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ManualResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - Manual
        id:
          type: string
        attributes:
          $ref: '#/components/schemas/ManualAttributes'
        meta:
          type: object
          properties:
            variants:
              type: array
              items:
                $ref: '#/components/schemas/VariantSummary'
              description: The published variants, with the slugs other routes take.
            issues:
              type: array
              items:
                $ref: '#/components/schemas/Issue'
            design:
              $ref: '#/components/schemas/DesignInUse'
            deleted:
              description: >-
                Set for a manual deleted on the ref’s first-parent line
                (`filter[status]`, #321): its newest deletion. The rest is then
                its last manifest the reader may see.
              type: object
              properties:
                commit:
                  type: string
                  description: The commit that deleted it.
                committedAt:
                  type: string
                  description: When (ISO 8601).
              required:
                - commit
                - committedAt
              additionalProperties: false
          required:
            - variants
            - issues
            - design
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
      additionalProperties: false
    ManualAttributes:
      type: object
      properties:
        schemaVersion:
          type: number
          enum:
            - 1
        kind:
          description: >-
            `derived` (#451): its entries are gathered from another manual by
            `rule`, never written by hand. Absent: an assembled manual.
          type: string
          enum:
            - derived
        title:
          anyOf:
            - type: string
              minLength: 1
              pattern: ^\S(?:[^\n\r]*\S)?$
            - type: object
              additionalProperties:
                type: string
                minLength: 1
                pattern: ^\S(?:[^\n\r]*\S)?$
        audience:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9-]*$
        deprecated:
          description: >-
            Withdrawn or superseded (#266): why, and the manual to use instead.
            Absent when it is not deprecated.
          allOf:
            - $ref: '#/components/schemas/Deprecation'
        variants:
          minItems: 1
          type: array
          items:
            type: object
            additionalProperties:
              type: string
              minLength: 1
        textAttributes:
          default: {}
          type: object
          additionalProperties:
            anyOf:
              - type: string
                minLength: 1
                pattern: ^\S(?:[^\n\r]*\S)?$
              - minItems: 1
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      minLength: 1
                      pattern: ^\S(?:[^\n\r]*\S)?$
                    when:
                      allOf:
                        - $ref: '#/components/schemas/Condition'
                  required:
                    - value
                  additionalProperties: false
        coverImage:
          description: >-
            The cover image its page design shows (#394): `default`, the
            manual’s, and `variants`, a variant’s own by its exact values, which
            wins. Absent: the design’s.
          type: object
          properties:
            default:
              type: object
              properties:
                asset:
                  type: string
                  pattern: ^sha256:[a-f0-9]{64}$
                alt:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 500
                      pattern: ^\S(?:[^\n\r]*\S)?$
                    - type: object
                      additionalProperties:
                        type: string
                        minLength: 1
                        maxLength: 500
                        pattern: ^\S(?:[^\n\r]*\S)?$
              required:
                - asset
                - alt
              additionalProperties: false
            variants:
              default: []
              maxItems: 100
              type: array
              items:
                type: object
                properties:
                  asset:
                    type: string
                    pattern: ^sha256:[a-f0-9]{64}$
                  alt:
                    anyOf:
                      - type: string
                        minLength: 1
                        maxLength: 500
                        pattern: ^\S(?:[^\n\r]*\S)?$
                      - type: object
                        additionalProperties:
                          type: string
                          minLength: 1
                          maxLength: 500
                          pattern: ^\S(?:[^\n\r]*\S)?$
                  variant:
                    type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                required:
                  - asset
                  - alt
                  - variant
                additionalProperties: false
          required:
            - variants
          additionalProperties: false
        rule:
          description: >-
            A derived manual’s rule (#451): `source`, the manual it gathers
            from; `moduleTypes`, the types it gathers (absent: the configured
            safety types); `exclude`, modules left out; `front` and `back`, its
            own modules before and after. Absent for an assembled manual.
          type: object
          properties:
            source:
              type: string
              maxLength: 100
              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            moduleTypes:
              minItems: 1
              maxItems: 100
              type: array
              items:
                type: string
                maxLength: 64
                pattern: ^[a-z][a-z0-9-]*$
            exclude:
              default: []
              maxItems: 500
              type: array
              items:
                type: string
                maxLength: 100
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            front:
              default: []
              maxItems: 500
              type: array
              items:
                type: string
                maxLength: 100
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            back:
              default: []
              maxItems: 500
              type: array
              items:
                type: string
                maxLength: 100
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            notices:
              type: object
              properties:
                groupBy:
                  default: module
                  type: string
                  enum:
                    - module
                    - level
                levels:
                  minItems: 1
                  maxItems: 4
                  type: array
                  items:
                    type: string
                    enum:
                      - danger
                      - warning
                      - caution
                      - notice
              required:
                - groupBy
              additionalProperties: false
          required:
            - source
            - exclude
            - front
            - back
          additionalProperties: false
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ManifestEntry'
          description: >-
            Only the modules the reader may see (groups left empty go too), so
            it can be empty. A derived manual’s are the ones its rule gathers,
            front matter first, back matter last.
      required:
        - schemaVersion
        - title
        - variants
        - textAttributes
        - entries
      additionalProperties: false
    VariantSummary:
      type: object
      properties:
        slug:
          type: string
          description: Use in `/manuals/{id}/variants/{variant}/…`, e.g. `model=large`.
        label:
          type: string
          description: For people, e.g. "Large · Software 2.3".
        values:
          type: object
          additionalProperties:
            type: string
          description: 'Variant attribute ID → value, e.g. `{ "model": "large" }`.'
      required:
        - slug
        - label
        - values
      additionalProperties: false
    DesignInUse:
      type: object
      properties:
        id:
          type: string
          description: >-
            The design's ID (`design/<id>.yaml`); `builtin` for the built-in
            design.
        name:
          nullable: true
          description: >-
            The design’s name; null for the built-in design and for a design
            that is not there.
          type: string
        source:
          type: string
          enum:
            - manual
            - project
            - builtin
          description: >-
            `manual`: the manifest’s own `design`; `project`: the project’s
            default (`pdf.design` in the configuration); `builtin`: neither
            names one.
        missing:
          type: boolean
          description: >-
            The design named is not in the content (or its file is no design):
            the PDF uses the built-in design, and the manual’s checks report
            `unknown-page-design`.
      required:
        - id
        - name
        - source
        - missing
      additionalProperties: false
    UnreadableManualResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - Manual
        id:
          type: string
        meta:
          type: object
          properties:
            error:
              type: string
              description: Why it cannot be read.
          required:
            - error
          additionalProperties: false
      required:
        - type
        - id
        - meta
      additionalProperties: false
    ManualDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ManualResource'
      required:
        - data
      additionalProperties: false
    ResolvedManualDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ResolvedManualResource'
      required:
        - data
      additionalProperties: false
    ResolvedManualResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ResolvedManual
        id:
          type: string
        attributes:
          type: object
          properties:
            title:
              type: string
            lang:
              type: string
            variant:
              type: object
              additionalProperties:
                type: string
              description: 'Variant attribute ID → value, e.g. `{ "model": "large" }`.'
            entries:
              type: array
              items:
                $ref: '#/components/schemas/ResolvedEntry'
            origins:
              type: object
              additionalProperties:
                type: object
                properties:
                  module:
                    type: string
                  block:
                    type: string
                required:
                  - module
                  - block
                additionalProperties: false
              description: Output block ID → the module and block it came from.
            anchors:
              type: object
              additionalProperties:
                type: string
              description: '`module` or `module#block` → the output block ID to link to.'
            callouts:
              description: >-
                Output image block ID → callout ID → its number in this variant
                (#498): what a `calloutRef` reads as. Absent without callouts.
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
            xrefTitles:
              description: >-
                Module ID → title, in the manual’s language or its fallback, of
                each module a cross-reference links to that is no entry of the
                manual (#796): what a cross-reference without its own text reads
                as. Only modules the reader may see and the manual’s audience
                allows.
              type: object
              additionalProperties:
                type: string
          required:
            - title
            - lang
            - variant
            - entries
            - origins
            - anchors
          additionalProperties: false
        relationships:
          type: object
          properties:
            manual:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Manual
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
          required:
            - manual
          additionalProperties: false
        meta:
          type: object
          properties:
            issues:
              type: array
              items:
                $ref: '#/components/schemas/ResolveIssue'
          required:
            - issues
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - relationships
        - meta
      additionalProperties: false
      description: '`id` is `<manual>/<variant>/<lang>`, as in the URL.'
    ResolvedEntry:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - module
            module:
              type: string
            title:
              type: string
            lang:
              type: string
              description: Differs from the manual when a translation is missing.
            blocks:
              type: array
              items:
                $ref: '#/components/schemas/Block'
          required:
            - kind
            - module
            - title
            - lang
            - blocks
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - group
            title:
              type: string
            entries:
              type: array
              items:
                $ref: '#/components/schemas/ResolvedEntry'
          required:
            - kind
            - title
            - entries
          additionalProperties: false
    ResolveIssue:
      type: object
      properties:
        severity:
          type: string
          enum:
            - error
            - warning
        code:
          type: string
          description: Stable machine-readable code, e.g. `missing-module`.
        message:
          type: string
        module:
          description: The module concerned.
          type: string
      required:
        - severity
        - code
        - message
      additionalProperties: false
    ManualVersionPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ManualVersionResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
            truncated:
              type: boolean
              description: >-
                The ref’s first-parent line goes on past the 1,000 newest
                commits looked at: older versions are not listed, and, when the
                manual existed before them, versions carry no revision number.
          required:
            - page
            - truncated
          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ManualVersionResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ManualVersion
        id:
          type: string
        attributes:
          type: object
          properties:
            commit:
              type: string
              description: A commit ID.
            committedAt:
              type: string
              description: When it was committed (ISO 8601, the committer’s offset).
            message:
              type: string
              description: >-
                The commit message without its trailers: for a merge, the change
                set’s title and a line naming it.
            merge:
              type: boolean
              description: Whether it is a merge (a change set merged into the ref).
            actor:
              nullable: true
              description: >-
                Who made it, as the commit’s trailers claim (`Merged-by`, else
                `Actor` for a save point); null when they name no one. Recorded
                by the server for the commits it makes, but a commit pushed from
                outside can claim anything.
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - user
                    - service
                id:
                  type: string
              required:
                - kind
                - id
              additionalProperties: false
            approvedBy:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - user
                      - service
                  id:
                    type: string
                required:
                  - kind
                  - id
                additionalProperties: false
              description: >-
                Who approved it, as its `Approved-by` trailers claim, in order:
                the approvers of a merged change set.
          required:
            - commit
            - committedAt
            - message
            - merge
            - actor
            - approvedBy
          additionalProperties: false
        relationships:
          type: object
          properties:
            actor:
              type: object
              properties:
                data:
                  nullable: true
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - User
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
              description: '`actor` when it is a user the server knows; else empty.'
            changeSet:
              type: object
              properties:
                data:
                  nullable: true
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - ChangeSet
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
              description: >-
                The change set it came from (`Merged-change-set`, else
                `Change-set`); empty when its trailers name none.
            approvers:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - User
                      id:
                        type: string
                    required:
                      - type
                      - id
                    additionalProperties: false
              required:
                - data
              additionalProperties: false
              description: The users among `approvedBy` the server knows.
          required:
            - actor
            - changeSet
            - approvers
          additionalProperties: false
        meta:
          type: object
          properties:
            revision:
              nullable: true
              description: >-
                The version’s number, counted from the oldest (1): derived,
                never stored. Null when the history was cut (`meta.truncated` on
                the document) while the module already existed before the oldest
                commit looked at, as the count would not start at the first.
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            change:
              type: string
              enum:
                - added
                - changed
                - removed
              description: >-
                How the module as the reader sees it differs from the version
                before: `added` (also back after a removal), `changed`,
                `removed` (deleted, or moved out of the reader’s scope).
            releases:
              type: array
              items:
                type: object
                properties:
                  tag:
                    type: string
                  commit:
                    type: string
                    description: A commit ID.
                required:
                  - tag
                  - commit
                additionalProperties: false
              description: >-
                The release tags (of the 50 newest) whose commit holds exactly
                this file, as the reader may see it there; newest first.
            unreadable:
              type: boolean
              description: >-
                The file after this commit cannot be read (shown only to a
                reader of all of its language).
            readAt:
              type: string
              description: >-
                The commit to read this version at (`GET /manuals/{id}/compare`,
                `GET /manuals/{id}?ref=`): its own (`attributes.commit`) for a
                reader of drafts (`content.read.draft`); for a reader of
                released content only, who is listed only the versions released
                content holds, the released commit holding it (`main`’s head,
                else the newest release tag in `releases`).
          required:
            - revision
            - change
            - releases
            - unreadable
            - readAt
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - relationships
        - meta
      additionalProperties: false
      description: >-
        `id` is `<manualId>/<commit>`. As a `ModuleVersion`, of the manual’s
        manifest (`manuals/<id>.yaml`); derived from Git, nothing of it is
        stored.
    ManualComparisonDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ManualComparisonResource'
      required:
        - data
      additionalProperties: false
    ManualComparisonResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - ManualComparison
        id:
          type: string
        attributes:
          type: object
          properties:
            base:
              nullable: true
              description: >-
                The manual at `base`, as the reader sees it on both sides
                (naming only the modules it may name to them on both); null when
                it is not there (or cannot be read: `meta.unreadable`).
              allOf:
                - $ref: '#/components/schemas/ManualAttributes'
            head:
              nullable: true
              description: The manual at `head`, likewise.
              allOf:
                - $ref: '#/components/schemas/ManualAttributes'
          required:
            - base
            - head
          additionalProperties: false
        meta:
          type: object
          properties:
            base:
              type: string
              description: The commit `base` named.
            head:
              type: string
              description: The commit `head` named.
            change:
              type: string
              enum:
                - added
                - changed
                - removed
                - unchanged
              description: >-
                `added` (not there at `base`), `removed` (not there at `head`),
                `changed`, or `unchanged` (the same manifest on both sides).
            fields:
              type: array
              items:
                type: string
              description: >-
                The manifest’s members that differ (`title`, `audience`,
                `variants`, `attributes`, `entries`, …), as in a change set’s
                changes. Empty unless changed.
            unreadable:
              type: boolean
              description: >-
                A side has a manifest that cannot be read (shown only to a
                reader of every audience).
          required:
            - base
            - head
            - change
            - fields
            - unreadable
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
      additionalProperties: false
      description: >-
        `id` is `<manualId>/<base commit>..<head commit>`. Derived from Git,
        never stored.
    SearchPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
          required:
            - page
          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    SearchResultResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - SearchResult
        id:
          type: string
        attributes:
          type: object
          properties:
            resourceType:
              type: string
              enum:
                - Module
                - Manual
                - Term
              description: >-
                What was found: a `Module` (one language), a `Manual` or a
                `Term` (one language).
            resourceId:
              type: string
              description: >-
                Its ID as in the URL: `<lang>/<moduleId>` for a module, the
                manual ID, the term ID.
            lang:
              description: >-
                The language of a module, or the one a term was found in; a
                manual has none.
              type: string
            title:
              type: string
              description: The title; for a term, its preferred variant in `lang`.
            blockId:
              description: >-
                The block, list item or step the text matched in, or the FAQ
                entry whose question matched. Absent unless a module’s text or
                question matched.
              type: string
          required:
            - resourceType
            - resourceId
            - title
          additionalProperties: false
        relationships:
          type: object
          properties:
            resource:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Module
                        - Manual
                        - Term
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
          required:
            - resource
          additionalProperties: false
        meta:
          type: object
          properties:
            matchedOn:
              type: string
              enum:
                - title
                - keyword
                - question
                - text
                - meaning
                - filter
              description: >-
                What matched `filter[q]`: the title, a keyword, an FAQ entry’s
                question (its block in `blockId`), or the text (for a term: its
                preferred variant, one of its allowed or forbidden variants, or
                its definition); `meaning` when only its meaning matched
                (semantic search, with an embedder configured: `matches` is
                empty, `blockId` names the closest block); `filter` when no
                query was given and the filters alone found it.
            excerpt:
              type: string
              description: >-
                Plain text, never markup: the title (a title match, or no
                query), the matching keywords separated by `, ` (a keyword
                match), the matching question, or a stretch of the matching (or,
                for `meaning`, the closest) block. Show it as text.
            matches:
              type: array
              items:
                $ref: '#/components/schemas/SearchMatch'
              description: >-
                Where the query’s words are in `excerpt`, in order, not
                overlapping: offsets in UTF-16 units (JavaScript string
                indexes).
            deprecated:
              type: boolean
              description: >-
                A deprecated module (by its source-language file) or manual
                (#266), for a badge. A term is never: its status is its own
                (`GET /terms`).
          required:
            - matchedOn
            - excerpt
            - matches
            - deprecated
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - relationships
        - meta
      additionalProperties: false
      description: >-
        `id` is `<type>:<resourceId>` (`term:<lang>/<termId>` for a term); one
        result per module and language, manual, or term and language.
    SearchMatch:
      type: object
      properties:
        start:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: First UTF-16 unit of the match.
        end:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: One past the last UTF-16 unit of the match.
      required:
        - start
        - end
      additionalProperties: false
    ChunkPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChunkResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
            leftOut:
              description: >-
                The modules the filters ask for (all but `filter[changedSince]`)
                that have no chunk because they are too large to cut (#688), in
                module ID, then language order; absent when there is none. Every
                other module is chunked as usual, and these are not counted in
                `meta.page.total`; with `filter[variant]`, a module too large
                for that variant alone is left out of the page holding it, named
                there, and still counted. Only modules you may read are named.
                The module’s checks report it as `expansion-too-large`.
              type: array
              items:
                $ref: '#/components/schemas/LeftOutModule'
          required:
            - page
          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ChunkResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - Chunk
        id:
          type: string
        attributes:
          type: object
          properties:
            moduleId:
              type: string
              maxLength: 100
              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            lang:
              type: string
              pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
            title:
              type: string
              minLength: 1
              pattern: ^\S(?:[^\n\r]*\S)?$
            moduleType:
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
              description: One of the configured module types, e.g. `procedure`.
            audience:
              description: >-
                The module’s audience level; absent: the most restricted level.
                Text from a more restricted module is never in the chunk.
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9-]*$
            facets:
              default: {}
              type: object
              additionalProperties:
                minItems: 1
                type: array
                items:
                  type: string
                  maxLength: 64
                  pattern: ^[a-z][a-z0-9-]*$
            keywords:
              type: array
              items:
                type: string
              description: >-
                Free-form keywords in the module’s language; empty when there
                are none.
            manuals:
              type: array
              items:
                type: string
                maxLength: 100
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              description: >-
                The manuals that include the module (their manifests name it,
                within their audience), as the reader may see them; sorted.
            conditions:
              type: array
              items:
                type: string
              description: >-
                The conditions of the variant blocks in the text, as `when` text
                (`model in (large)`), in document order, each once; on an FAQ
                entry’s chunk, those of the variant blocks it stands in first.
                Listed also when `filter[variant]` resolved them.
            text:
              type: string
              description: >-
                The module as Markdown (CommonMark with GFM tables): the title
                as `#` heading, sections as headings, procedure steps numbered,
                tables as Markdown tables, safety messages and notes as quotes
                headed by their signal word, images as their alt text,
                attachments by name, referenced modules inlined. Without
                `filter[variant]` each variant block is a quote headed by
                `**when**` and its condition. Text attributes stay `{name}`.
                Markup characters in the content are backslash-escaped; no HTML
                but `<br>` between the lines of a table cell.
            sourceHash:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: >-
                SHA-256 of the module’s own source: of its translation units’
                source hashes, or of its canonical AsciiDoc when it has none.
            contentHash:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: >-
                SHA-256 of `text` (UTF-8). Equal text, equal hash: re-embed only
                when it changes.
            entry:
              description: >-
                Only on an FAQ entry’s chunk: its `text` is that entry (the
                question as `#` heading, then its answer) and `sourceHash`,
                `conditions` and `meta.sources` are the entry’s; the other
                attributes stay the module’s. The module’s own chunk keeps its
                entries in its text too.
              type: object
              properties:
                blockId:
                  type: string
                  maxLength: 64
                  pattern: ^[a-z_][a-z0-9_-]*$
                  description: The FAQ entry’s block ID in the module.
                question:
                  type: string
                  description: The question as plain text; a text attribute as `{name}`.
              required:
                - blockId
                - question
              additionalProperties: false
          required:
            - moduleId
            - lang
            - title
            - moduleType
            - facets
            - keywords
            - manuals
            - conditions
            - text
            - sourceHash
            - contentHash
          additionalProperties: false
        relationships:
          type: object
          properties:
            module:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Module
                    id:
                      type: string
                  required:
                    - type
                    - id
                  additionalProperties: false
                links:
                  type: object
                  properties:
                    related:
                      type: string
                      description: The module in the API, at the commit read.
                  required:
                    - related
                  additionalProperties: false
              required:
                - data
                - links
              additionalProperties: false
          required:
            - module
          additionalProperties: false
        meta:
          type: object
          properties:
            ref:
              type: string
              description: The ref the chunk was read at (`?ref=`).
            commit:
              type: string
              description: The commit the chunk was read at.
            sources:
              type: array
              items:
                type: object
                properties:
                  moduleId:
                    type: string
                    maxLength: 100
                    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  lang:
                    type: string
                    pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
                required:
                  - moduleId
                  - lang
                additionalProperties: false
              description: >-
                The module files the text was made from: the module first, then
                each module it includes, in the language read.
            release:
              nullable: true
              description: >-
                The module’s newest release (tag), as `meta.status.release` of
                `GET /modules/{lang}/{id}`: the product revision a pipeline
                filters by. Null when none of the 50 newest holds it.
              type: object
              properties:
                tag:
                  type: string
                  description: The release tag.
                commit:
                  type: string
                  description: A commit ID.
                same:
                  type: boolean
                  description: Whether the module there is exactly the one read.
              required:
                - tag
                - commit
                - same
              additionalProperties: false
          required:
            - ref
            - commit
            - sources
            - release
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - relationships
        - meta
      additionalProperties: false
      description: >-
        `id` is `<lang>/<moduleId>`: one chunk per module and language; and
        `<lang>/<moduleId>/<blockId>` for each FAQ entry in it, which has a
        chunk of its own (`attributes.entry`).
    LeftOutModule:
      type: object
      properties:
        moduleId:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        lang:
          type: string
          pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        reason:
          type: string
          enum:
            - size
            - depth
          description: >-
            `size`: once its module references are included it holds more than
            500,000 content nodes, 12,000,000 characters or 1,000,000 table
            cells (rows × columns) (a module referred to over several paths
            counts once per path); `depth`: its blocks and references nest more
            than 100 deep.
      required:
        - moduleId
        - lang
        - reason
      additionalProperties: false
    ChangePageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChangeResource'
        meta:
          type: object
          properties:
            page:
              type: object
              properties:
                size:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                  description: The most events asked for.
                cursor:
                  type: string
                  description: >-
                    Where the next page starts (opaque): pass it as
                    `page[cursor]`. Keep it with what you stored: it is how you
                    resume after a restart.
              required:
                - size
                - cursor
              additionalProperties: false
            upToDate:
              type: boolean
              description: >-
                Nothing more to tell right now: poll again later with
                `meta.page.cursor` (or when a webhook arrives).
          required:
            - page
            - upToDate
          additionalProperties: false
        links:
          type: object
          properties:
            self:
              type: string
            next:
              type: string
              description: >-
                This route with the next cursor: always there, a feed never
                ends.
          required:
            - self
            - next
          additionalProperties: false
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ChangeResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - Change
        id:
          type: string
        attributes:
          type: object
          properties:
            event:
              type: string
              enum:
                - manual.released
                - module.released
                - release.withdrawn
                - module.deprecated
                - manual.deprecated
                - chunk.upserted
                - chunk.removed
              description: >-
                What happened. The webhook events (`manual.released`,
                `module.released`, `release.withdrawn`, `module.deprecated`,
                `manual.deprecated`) have the shapes and idempotency keys
                webhook deliveries have; `chunk.upserted` and `chunk.removed`
                tell a retrieval index what to store and what to drop, per chunk
                of `GET /chunks`.
            occurredAt:
              type: string
              description: >-
                When the release, withdrawal or deprecation was recorded (ISO
                8601); for a snapshot or a change of your scope, when it was
                told.
            data:
              type: object
              additionalProperties: {}
              description: >-
                IDs and what changed, never content. `chunk.upserted`: `chunkId`
                (`GET /chunks`’s `id`), `moduleId`, `lang`, `blockId` (an FAQ
                entry’s, else null), `contentHash` (the chunk’s, as `GET
                /chunks` gives it: re-embed only when it differs from yours) and
                `release` (`releaseId`, `product`, `revision`, `tag`, `commit`:
                read the chunk at `?ref=<commit>`). `chunk.removed`: `chunkId`,
                `moduleId`, `lang`, `blockId`, `reason` (`deprecated`: with no
                replacement; `withdrawn`: its release was withdrawn; `gone`:
                deleted, or no longer yours to read, never told which) and
                `release` (the release now standing, or null). The webhook
                events: as their deliveries’ `data`.
          required:
            - event
            - occurredAt
            - data
          additionalProperties: false
      required:
        - type
        - id
        - attributes
      additionalProperties: false
    ReleaseListPageDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDetailResource'
        meta:
          type: object
          properties:
            page:
              $ref: '#/components/schemas/PageMeta'
          required:
            - page
          additionalProperties: false
        links:
          $ref: '#/components/schemas/PageLinks'
      required:
        - data
        - meta
        - links
      additionalProperties: false
    ReleaseDetailResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - Release
        id:
          type: string
        attributes:
          $ref: '#/components/schemas/ReleaseAttributes'
        meta:
          type: object
          properties:
            outputs:
              nullable: true
              description: >-
                Where the release’s outputs stand, counted as you may read them
                (as `GET /releases/{releaseId}/outputs` lists them, so no count
                tells of one outside your scope). Null when its tag cannot be
                read.
              allOf:
                - $ref: '#/components/schemas/ReleaseOutputsProgress'
          required:
            - outputs
          additionalProperties: false
      required:
        - type
        - id
        - attributes
        - meta
      additionalProperties: false
    ReleaseAttributes:
      type: object
      properties:
        product:
          type: string
          description: >-
            The product: a value of `productFacet` (`release.productFacet` in
            `openfolia.yaml`, else the first facet).
        productFacet:
          type: string
          description: The facet the product is a value of, as configured then.
        revision:
          type: string
          description: The product revision, e.g. `2.1`.
        tag:
          type: string
          description: >-
            The release’s annotated tag (named by `CCMS_RELEASE_TAG`, default
            `release/{product}/{revision}`): pass it as `?ref=` to read the
            content as released.
        tagObject:
          type: string
          description: The annotated tag object’s ID.
        commit:
          type: string
          description: >-
            The commit released: `main`’s head when it was cut, or a maintenance
            line’s.
        notes:
          nullable: true
          description: >-
            The publisher’s summary (plain text with line breaks); also the tag
            message’s body. Null when none was given.
          type: string
        notesByLanguage:
          type: object
          additionalProperties:
            type: string
          description: >-
            Summaries per language, by language tag (plain text with line
            breaks); each also in the tag message, after a line
            `[notes:<lang>]`. Empty when none were given.
        major:
          type: boolean
          description: >-
            Marked a major change by its publisher: its readers are told (a
            notification), and the tag message’s title ends in ` (major)`.
        publishedBy:
          type: object
          properties:
            kind:
              type: string
              enum:
                - user
                - service
            id:
              type: string
          required:
            - kind
            - id
          additionalProperties: false
          description: Who cut it.
        publishedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: 'When it was cut: the tag’s date, to the second.'
        withdrawal:
          nullable: true
          description: >-
            Set once the release is withdrawn: its tag stays readable, but it no
            longer counts as a module’s latest release. Null while it stands.
          type: object
          properties:
            by:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - user
                    - service
                id:
                  type: string
              required:
                - kind
                - id
              additionalProperties: false
              description: Who withdrew it.
            at:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              description: When.
            reason:
              type: string
              description: Why, in their words.
          required:
            - by
            - at
            - reason
          additionalProperties: false
      required:
        - product
        - productFacet
        - revision
        - tag
        - tagObject
        - commit
        - notes
        - notesByLanguage
        - major
        - publishedBy
        - publishedAt
        - withdrawal
      additionalProperties: false
    ReleaseOutputsProgress:
      type: object
      properties:
        state:
          type: string
          enum:
            - planning
            - rendering
            - done
            - failed
          description: >-
            `planning`: the outputs are still being planned (there may be none
            yet); `rendering`: some are queued or rendering; `failed`: none is
            under way and some failed (or planning failed for good, with none
            planned: plan them again; or planning was refused: `refused`);
            `done`: all are done (`total` 0: the release has no outputs you may
            read, no manuals at its tag, or none you read whole).
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The outputs you may read (`GET /releases/{releaseId}/outputs`).
        queued:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Of those, queued.
        rendering:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Of those, rendering.
        done:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Of those, done.
        failed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Of those, failed.
        refused:
          nullable: true
          description: >-
            Why the release’s outputs were not planned (#477); null when they
            were, or are being planned again.
          type: object
          properties:
            reason:
              type: string
              enum:
                - too-many-outputs
              description: >-
                `too-many-outputs`: the release would have more outputs (every
                manual at its tag × its variants × the configured languages)
                than a release may have (`CCMS_RELEASE_MAX_OUTPUTS`), so none
                were planned. Planning it again (`POST
                /releases/{releaseId}/outputs/plan`) works once the limit is
                raised.
            wanted:
              nullable: true
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: >-
                The outputs the release would have. Only for one who may plan it
                again (`release.publish` for its product); null for other
                readers, as it counts manuals they may not read.
            max:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: >-
                The limit now (`CCMS_RELEASE_MAX_OUTPUTS`), as planning it again
                is judged. A refusal the limit was raised past is no longer
                told: the state is then `failed` with `refused` null, until the
                release is planned again.
          required:
            - reason
            - wanted
            - max
          additionalProperties: false
        queue:
          nullable: true
          description: >-
            What the release waits for (#497), for one who may plan the release
            again (`release.publish` for its product), as it counts manuals
            other readers may not read: while its planning waits, the earlier
            releases planned first (`releases`); while it renders and some of
            its outputs are queued, the later releases’ outputs rendered first
            (`ahead`). Null otherwise (another reader, nothing ahead of it, or a
            list of releases, which leaves it out).
          type: object
          properties:
            ahead:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: >-
                How many outputs of the same product’s releases cut after this
                one are still to render (queued or rendering): they go first,
                newest release first. 0 while it is planned and has no queued
                outputs of its own.
            releases:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: >-
                While its planning waits (`state` `planning`): how many of the
                same product’s releases cut before this one are still to be
                planned (at most the 200 nearest are looked at). Releases are
                planned strictly in the order they were cut, so these go before
                it. 0 while it renders.
          required:
            - ahead
            - releases
          additionalProperties: false
      required:
        - state
        - total
        - queued
        - rendering
        - done
        - failed
        - refused
        - queue
      additionalProperties: false
    ReleaseDetailDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ReleaseDetailResource'
      required:
        - data
      additionalProperties: false
    ReleaseChangePageDocument:
      type: object
