  /releases/{releaseId}/dita-packages:
    get:
      description: >-
        One DITA 1.3 package per release output (a manual in one of its variants
        and a configured language), its `id` the output’s: the manual as a map
        (`<lang>/<manual>.ditamap`), a topic per module of the topic type its
        module type maps to (`<lang>/<module>.dita`), the media they show and a
        DITAVAL file for the variant (`filters/`), by the configuration’s DITA
        mapping (`dita` in `openfolia.yaml`) read backwards. Listing makes none:
        each is made when it is read. Ordered by manual, variant, language.
        Needs `content.read` at the release’s tag, in a role that covers all of
        the output’s manual: its audience and language, with no module type or
        facet left out, and the source language too, as for the release’s
        outputs. A package is made as the manual’s audience reads it, the same
        for all of its readers. Others get 404, exactly like a missing one.
      operationId: DitaPackages_list
      parameters:
        - name: releaseId
          required: true
