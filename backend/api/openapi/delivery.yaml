  /search:
    get:
      description: >-
        Modules by title, keywords, FAQ questions and text, manuals by title,
        and terms (one result per term and language) by their preferred variant
        (as the title), their allowed and forbidden variants (as keywords) and
        their definition (as text), among what the reader may see, at `?ref=`.
        Case and diacritics do not matter, and every word of the query is found
        anywhere in a title, in the keywords, in one FAQ question or in one
        block. With the Postgres search (the default) a word is found in any of
        its forms in the content’s language too (`starting` finds `starts`), and
        with a typo in a title or keyword; with an embedder configured, by
        meaning too (`meta.matchedOn: meaning`, after every word match). Title
        matches come first, then keyword matches, FAQ question matches
        (`meta.matchedOn: question`) and text matches, each ranked by how well
        they match in all of those ways. The filters run before paging, and the
        total counts only results the reader may see. A module filter (type,
        audience, facet, keyword) leaves manuals and terms out; with one,
        `filter[q]` may be left out, and every module the filters let through is
        a result (`meta.matchedOn: filter`), ordered by title. A filter value
        the configuration does not know matches nothing (no error). The excerpt
        is plain text with the match offsets in `meta`. Limits: each reader (a
        person or a service account) may search `CCMS_SEARCH_PER_MINUTE` times a
        minute on a server (default 120; past it 429 `rate-limited`), and a
        search has `CCMS_SEARCH_TIMEOUT_MS` in the database for all its
        statements together (default 5 s; past it 503 `database-timeout`); both
        answers carry `Retry-After`.
      operationId: Search_search
      parameters:
        - name: filter[q]
          required: false
          in: query
          description: >-
            What to search for, 1 to 200 characters after trimming. Every word
            has to match, in the title, in the keywords or in one block's text;
            case and diacritics do not matter. Required unless a module filter
            (`filter[type]` as a module type, `filter[audience]`,
            `filter[facet]`, `filter[keyword]`) is given.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: filter[lang]
          required: false
          in: query
          description: >-
            Only modules and terms in this language (manuals have none, so they
            are left out).
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        - name: filter[resourceType]
          required: false
          in: query
          description: >-
            Only `Module`, only `Manual` or only `Term` results (as in
            `attributes.resourceType`; `module`, `manual` and `term` too).
          schema:
            type: string
            enum:
              - module
              - manual
              - term
              - Module
              - Manual
              - Term
        - name: filter[type]
          required: false
          in: query
          description: >-
            Only modules of this module type (a configured key, e.g.
            `procedure`); manuals are left out. **Deprecated meaning:** without
            `filter[resourceType]`, the values `module` and `manual` still mean
            `filter[resourceType]`, as they did before it; use
            `filter[resourceType]` for that.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[audience]
          required: false
          in: query
          description: >-
            Only modules that count as this audience level: their own, or the
            last, most restricted level for a module naming none, as manuals and
            the access check place it. A level the configuration does not list
            matches nothing, and a module naming such a level matches no level.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[facet]
          required: false
          in: query
          description: >-
            Only modules with this facet value, as `<facet>:<value>` (e.g.
            `region:north`). Repeat it for several, at most 32: a module has to
            have every one.
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: filter[keyword]
          required: false
          in: query
          description: >-
            Only modules with this keyword, case and diacritics aside (`Wärme`
            is `warme`); 1 to 64 characters, no comma. Repeat it for several, at
            most 32: a module has to have every one.
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: page[number]
          required: false
          in: query
          description: 'Page to return, from 1. Default: 1.'
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          required: false
          in: query
          description: 'Resources per page. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SearchPageDocument'
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `invalid-content`: a file needed for the answer is broken; the
            error's `meta.path` names it. `table-too-large`: a module file holds
            a table of more than 1,000 columns or 50,000 cells (rows × columns),
            or tables of more than 1,000,000 cells together, so it is not read
            (`meta.path`; `meta.columns`, `meta.cells`, `meta.totalCells`: the
            caps).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          description: >-
            `rate-limited`: more searches this minute than
            `CCMS_SEARCH_PER_MINUTE` allows the reader on this server, or two of
            the reader’s searches are in progress already (`Retry-After: 1`);
            `Retry-After` (and `meta.retryAfter`) says when to try again.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            `database-timeout`: the search took longer in the database than
            `CCMS_SEARCH_TIMEOUT_MS` (all its statements together) and was
            stopped. `search-busy`: as many searches as
            `CCMS_SEARCH_CONCURRENCY` allows ran at once on this server, and
            this one waited too long for its turn. Each with `Retry-After`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Search modules, manuals and terms
      tags:
        - search
      x-audience: delivery
      x-required-permission: content.read
  /chunks:
    get:
      description: >-
        The content as retrieval chunks: one per module and language the reader
        may see at `?ref=`, ordered by module ID and language, each followed by
        one per FAQ entry in it (`attributes.entry`, the entry alone as its
        text), each the module as Markdown with the metadata to filter on (type,
        audience, facets, keywords, manuals, variant conditions, the newest
        release) and `contentHash`, the SHA-256 of the text, so a pipeline
        re-embeds only what changed. Scoped like every read: a module outside
        the reader’s scope is never listed, counted or inlined into another
        chunk, and the filters run before paging. A module too large to cut once
        its module references are included has no chunk, and only it:
        `meta.leftOut` names it. Modules too large to cut together (many each
        including a lot, past a budget of four times the content they are made
        from) make the whole commit a 422 `chunk-set-too-large`, for readers who
        see them.
      operationId: Chunks_list
      parameters:
        - name: filter[module]
          required: false
          in: query
          description: >-
            Only the chunks of this module (a module ID), one per language the
            reader may read it in (and one per FAQ entry in it). A module
            outside the reader’s scope, or that does not exist, has none.
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        - name: filter[lang]
          required: false
          in: query
          description: Only chunks in this language.
          schema:
            type: string
            pattern: ^[a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        - name: filter[type]
          required: false
          in: query
          description: Only modules of this module type.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[audience]
          required: false
          in: query
          description: >-
            Only modules that count as this audience level: their own, or the
            last, most restricted level for a module naming none, as manuals and
            the access check place it. A level the configuration does not list
            matches nothing, and a module naming such a level matches no level.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[facet]
          required: false
          in: query
          description: >-
            Only modules with this facet value, as `<facet>:<value>` (e.g.
            `region:north`). Repeat it for several, at most 32: a module has to
            have every one.
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: filter[keyword]
          required: false
          in: query
          description: >-
            Only modules with this keyword, case and diacritics aside (`Wärme`
            is `warme`); 1 to 64 characters, no comma. Repeat it for several, at
            most 32: a module has to have every one.
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: filter[manual]
          required: false
          in: query
          description: >-
            Only the modules this manual includes, as the reader may see it
            (with `filter[variant]`: the entries it includes for that variant).
            A manual the reader may not see, or that does not exist, includes
            nothing.
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        - name: filter[variant]
          required: false
          in: query
          description: >-
            A variant slug such as `model=large,software=2.3` (as `GET
            /manuals/{id}` lists them, or any configured attribute values):
            variant blocks are resolved for it, so one for another variant is
            not in the text. Without it, each variant block is kept, headed by
            its condition. An attribute or value the configuration does not hold
            is a 422 `unknown-variant`.
          schema:
            type: string
            maxLength: 500
        - name: filter[changedSince]
          required: false
          in: query
          description: >-
            A full commit ID in the history of the commit read (one a previous
            sync got in `X-Ccms-Commit`): only the chunks that may have changed
            since, because a module file their text was made from or depends on
            (an included module, a translation of it, a cross-reference target),
            the configuration or a manifest naming the module changed.
            `meta.release` is no file: a new release lists nothing here. Any
            other commit is a 400 `invalid-parameter`. Only files you may read
            now count: a deleted module, or a chunk whose included module was
            deleted or left your scope since, is not listed, so a full sync now
            and then catches those.
          schema:
            type: string
            pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
        - name: page[number]
          required: false
          in: query
          description: 'Page to return, from 1. Default: 1.'
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          required: false
          in: query
          description: 'Resources per page. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: ref
          required: false
          in: query
          description: >-
            Branch, tag or commit ID to read from. Default: the server's
            `CCMS_DEFAULT_REF`.
          schema:
            type: string
      responses:
        '200':
          headers:
            X-Ccms-Commit:
              description: The commit the response was read from.
              schema:
                type: string
            X-Ccms-Withdrawn:
              description: >-
                `true` when `?ref=` names the tag of a withdrawn release (as
                `refs/tags/<tag>`, or `<tag>` when no branch has that name): the
                read still works, but the release was taken back. Who, when and
                why: `meta.withdrawal` of the tag in `GET /refs`, or
                `attributes.withdrawal` of the release in `GET /releases`.
                Absent otherwise.
              schema:
                type: string
            ETag:
              description: >-
                Changes with the commit, with what the reader may see and when
                the release whose tag is read is withdrawn.
              schema:
                type: string
            Cache-Control:
              description: >-
                `immutable` when `?ref=` was a commit ID, except on routes whose
                answer also depends on refs (a module’s status): `no-cache`
                there.
              schema:
                type: string
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ChunkPageDocument'
        '304':
          description: The `If-None-Match` ETag is still current.
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-found`: unknown ref, or no such item at that ref.
            `change-set-branch-missing`: `ref` is the branch of a change set the
            reader may see, and that branch is gone from the content repository
            (`meta.branch`; the change set says so in `meta.branchMissing`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: >-
            `invalid-content`: a file needed for the answer is broken; the
            error's `meta.path` names it. `unknown-variant`: `filter[variant]`
            names an attribute or value the configuration does not hold.
            `chunk-set-too-large`: the chunks of the commit, as you see them,
            are too large to cut together; `meta` names the budget (`nodes`,
            `chars`, `tableCells`) and the modules that expanded the most
            (`largest`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: List retrieval chunks
      tags:
        - chunks
      x-audience: delivery
      x-required-permission: content.read
  /changes:
    get:
      description: >-
        Releases, withdrawals and deprecations (of modules and of manuals) in
        the order they happened, as events: the webhook events (the same shapes
        and idempotency keys), and per release the chunks (`GET /chunks`) to
        store (`chunk.upserted`) and to drop (`chunk.removed`), so a retrieval
        index stays in sync. Cursor-paged: no event is skipped or told twice
        across pages, whatever is released meanwhile. Scoped to what you may
        read now: when your scope narrows, the chunks you may no longer read
        come as `chunk.removed`, to you only; nothing names what you never could
        read. Needs the `content.read` permission and the instance secret key
        (else 404 `not-configured`).
      operationId: Changes_list
      parameters:
        - name: page[cursor]
          required: false
          in: query
          description: >-
            Where to go on: `meta.page.cursor` of the page before. Left out:
            start with a snapshot of every chunk you may read at the release
            standing now, then the changes after it. A cursor that can no longer
            be read (the server’s secret key changed, it was issued to someone
            else) is a 400 `cursor-expired`: start again without one. A cursor
            standing on content gone from the repository is a 410 `cursor-gone`:
            resync.
          schema:
            type: string
            maxLength: 4096
            pattern: ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$
        - name: page[size]
          required: false
          in: query
          description: 'The most events to answer. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ChangePageDocument'
        '400':
          description: >-
            `cursor-expired`: the cursor can no longer be read (the instance key
            was rotated, it was issued to someone else, it was changed, or it
            was made by an older way of cutting chunks): start again without
            one. `invalid-parameter`: a malformed cursor or size.
            `unsupported-parameter`: any other query parameter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: >-
            `not-configured`: the server has no instance secret key, which seals
            the cursors.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '410':
          description: >-
            `cursor-gone`: the cursor stands on chunks that can no longer be
            read (the commit of a release you hold is gone from the repository
            after a history rewrite, or its content no longer reads), so what to
            remove cannot be named; or it is from before the server’s database
            was restored from another server (#619). Resync: drop what you
            stored and start again without `page[cursor]` (a snapshot follows),
            or rebuild from a release tag (`GET /chunks?ref=<tag>`, keeping what
            has the same `contentHash`) and then start again without
            `page[cursor]`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          description: >-
            `rate-limited`: a page is being read for you already
            (`Retry-After`): one at a time.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '503':
          description: >-
            `outbox-blocked`: the server’s database was restored from another
            server and its operator has not finished the restore yet, so reading
            on could skip events (`Retry-After`): try again later with the same
            cursor.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Read the change feed
      tags:
        - changes
      x-audience: delivery
      x-required-permission: content.read
  /releases:
    get:
      description: >-
        Releases, newest first, withdrawn ones too (`attributes.withdrawal`):
        each a product revision tagged on the whole of `main` at one commit.
        Read the content as released with `?ref=<attributes.tag>`. Releases are
        released content, so every reader may list them; what a reader sees at a
        tag is limited to their scope. Each release’s `meta.outputs` says where
        its files stand, as `GET /releases/{releaseId}` does (but with `queue`
        always null: what waits ahead of a release is counted for its own read
        only), so a list shows them without a read per release. Needs the
        `content.read` permission.
      operationId: Releases_list
      parameters:
        - name: filter[product]
          required: false
          in: query
          description: Only releases of this product (a value of the product facet).
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
        - name: filter[major]
          required: false
          in: query
          description: >-
            `true`: only major releases; `false`: only the others. Left out:
            all.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: filter[state]
          required: false
          in: query
          description: >-
            `withdrawn`: only withdrawn releases; `published`: only those that
            stand. Left out: all.
          schema:
            type: string
            enum:
              - published
              - withdrawn
        - name: page[number]
          required: false
          in: query
          description: 'Page to return, from 1. Default: 1.'
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          required: false
          in: query
          description: 'Resources per page. Default: 50, at most 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReleaseListPageDocument'
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: List releases
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /releases/{releaseId}:
    get:
      description: >-
        One release: its product, revision, tag, commit, notes, whether it is
        major, who cut it and when, and its withdrawal (who, when, why) once
        withdrawn; `meta.outputs` says where its files stand (still being
        planned, rendering, done or failed, with counts of those you may read),
        for a client to show progress and poll while they are under way. Needs
        the `content.read` permission.
      operationId: Releases_get
      parameters:
        - name: releaseId
          required: true
          in: path
          description: >-
            The release’s ID (a UUID). One that names no release, malformed or
            not, is 404.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReleaseDetailDocument'
        '400':
          description: A query parameter the route does not support, or a malformed one.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '401':
          description: Missing or wrong API token.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '403':
          description: '`forbidden`: the actor lacks the `content.read` permission.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: '`not-found`: no release with this ID.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '406':
          description: The `Accept` header rules out `application/vnd.api+json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
      summary: Read a release
      tags:
        - releases
      x-audience: delivery
      x-required-permission: content.read
  /releases/{releaseId}/changes:
    get:
      description: >-
        The changelog of one release: one `ReleaseChange` per manual and
        language that changed (a release holds the whole repository, so every
        manual counts) since the product’s previous release that is not
        withdrawn (by when it was cut; for a release of a maintenance line, the
        line’s previous one, else its base release; for one of `main`, never a
        line’s), each with the modules it names that changed in that language
        (`added`, `changed`, `removed`, with their blocks by ID). A product’s
        first release lists every manual as `added`. Derived from Git, never
        stored. Both releases are read as you may read them: a manual or module
        outside your scope is not there, exactly like a missing one, so it is
        neither listed nor counted. Ordered by manual ID, then language. A pair
        of releases too large to compare (more than the files a review reads,
        counted over the whole repository) is 422 `too-many-changes` for every
