# The editor image's web server (Dockerfile, target `editor`): the static build, /api proxied to
# the API and /mcp to the MCP server. The entrypoint writes /tmp/openfolia/api.conf (the API's
# address and, when CCMS_EDITOR_API_TOKEN is set, the token), /tmp/openfolia/mcp.conf and
# /tmp/openfolia/listen.conf before nginx starts.
# Everything nginx writes is under /tmp, so the container runs with a read-only file system.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    # The token, when set, is never logged: the access log has no request headers.
    log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # A request through /api is cross-site when it has an Origin whose host:port is not the Host
    # it was sent to (the same check as the dev server's, frontend/editor/tools/proxy-origin.mjs):
    # no Origin passes (a same-origin read, curl, a cross-site <img>), as does the editor's own.
    # A reverse proxy in front must keep the Host header (deploy/README.md, "Reverse proxy").
    map "$http_origin|$http_host" $openfolia_cross_site {
        "~^\|" 0;
        "~*^https?://(?<origin_host>[^/|]+)\|(?P=origin_host)$" 0;
        default 1;
    }

    # With the token injected, an /api request must also show it comes from the editor's own
    # page: an Origin equal to its Host, or (a same-origin GET, which browsers send without
    # Origin) Sec-Fetch-Site: same-origin. Anything else (a cross-site <img> or link, curl with
    # neither header) is refused before the token is added.
    map "$http_origin|$http_host|$http_sec_fetch_site" $openfolia_not_same_origin {
        "~*^https?://(?<same_host>[^/|]+)\|(?P=same_host)\|" 0;
        "~*^\|[^|]*\|same-origin$" 0;
        default 1;
    }

    # The path the API gets: /api taken off the request's own URI, as the browser sent it (no
    # decoding or normalising; the query string kept).
    map $request_uri $openfolia_api_uri {
        "~^/api(?<api_rest>/.*)$" $api_rest;
        default /;
    }

    # When CCMS_EDITOR_HOSTS is set: a default server answering 421 to any other Host (a
    # DNS-rebinding page names its own host), and /healthz for the container's health check.
    include /tmp/openfolia/default-server.conf;

    server {
        # listen and server_name: CCMS_EDITOR_HOSTS, or every Host when it is unset.
        include /tmp/openfolia/listen.conf;
        root /usr/share/openfolia/editor;
        # Redirects keep the scheme and host the browser used (behind a TLS proxy too).
        absolute_redirect off;

        # The container's health check; not logged.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        # SAML's assertion consumer service (#376): the identity provider's page posts the person's
        # answer here from its own site, so the cross-site check of /api/ cannot apply. This one
        # address only, POST only, and never with the token (nor a user header): the API checks the
        # signed answer itself.
        location = /api/auth/saml/callback {
            limit_except POST {
                deny all;
            }
            client_max_body_size 1m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header X-Ccms-User "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            include /tmp/openfolia/saml.conf;
        }

        location /api/ {
            # Refused in @cross_site (an `if` cannot set the answer's type itself).
            error_page 418 = @cross_site;
            if ($openfolia_cross_site) {
                return 418;
            }
            # The API enforces its own upload limits while it reads (CCMS_MAX_UPLOAD_BYTES, ...),
            # so the body is streamed to it instead of buffered here.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # A PDF may take up to CCMS_PDF_TIMEOUT_MS (default 60 s), waiting included.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # The reader's address, for the API's limits (CCMS_TRUST_PROXY, #574).
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_pass; when the token is set, the same-origin check above and the
            # Authorization header.
            include /tmp/openfolia/api.conf;
        }

        # The stable addresses (#450): a manual's page, PDF and QR codes for readers, at the
        # editor's root (CCMS_PUBLIC_URL names this host). Read only, never with the token: the
        # API decides who may open them (openfolia.yaml delivery.access).
        location ^~ /d/ {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            # A reader follows a printed code with no credentials; a client that has them uses
            # /api/d/. Dropping them keeps bad tokens here from counting against the proxy.
            proxy_set_header Authorization "";
            proxy_set_header X-Ccms-User "";
            # Nor a signed-in session's cookie (#37): readers read as anyone does.
            proxy_set_header Cookie "";
            # The reader's address, for the API's rate limit (CCMS_TRUST_PROXY, #574).
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            include /tmp/openfolia/addresses.conf;
        }

        # The MCP server (#860, backend/mcp): its endpoint at the editor's own address, so a client
        # connects to https://<editor host>/mcp. The server checks everything itself: the bearer
        # token, the Origin (its CCMS_MCP_HTTP_ALLOWED_ORIGINS, so not the /api check above), and
        # the lockout and rate per client address, which it takes from X-Forwarded-For
        # (CCMS_MCP_HTTP_TRUST_PROXY). The include proxies it (CCMS_EDITOR_MCP_URL), or answers
        # 404 without it; an MCP service that is not running answers 404 too (@mcp_unavailable).
        location = /mcp {
            error_page 404 502 504 = @mcp_unavailable;
            error_page 413 = @mcp_too_large;
            # The server's own limit (1 MiB), so a larger body stops here.
            client_max_body_size 1m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Answers are JSON (stateless, no SSE stream), passed on as they come.
            proxy_buffering off;
            # A tool call has 120 s, waiting included.
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            # The editor's session is not the MCP server's business.
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            include /tmp/openfolia/mcp.conf;
        }

        location ^~ /mcp/ {
            default_type application/json;
            return 404 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"Not found: the endpoint is /mcp"},"id":null}';
        }

        # Answers in the server's own shape (a JSON-RPC error without an id). No upstream address:
        # no MCP server here (unset, or its name resolves to nothing), so 404; else it did not
        # answer.
        location @mcp_unavailable {
            default_type application/json;
            if ($upstream_addr = "") {
                return 404 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"Not found: no MCP server runs on this instance"},"id":null}';
            }
            return 502 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"The MCP server did not answer"},"id":null}';
        }

        location @mcp_too_large {
            default_type application/json;
            return 413 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"Request body too large"},"id":null}';
        }

        location @cross_site {
            default_type application/vnd.api+json;
            return 403 '{"errors":[{"status":"403","title":"Forbidden","code":"cross-origin-request","detail":"The editor forwards API requests from its own origin only."}]}';
        }

        # Hashed build files (main-<hash>.js, chunk-<hash>.js, styles-<hash>.css, media/):
        # their name changes with their content.
        location ~* "^/(?:media/.+|[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css))$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Everything else (index.html, the translations, the brand files) is revalidated, and any
        # path that is no file is the app's own route.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            try_files $uri /index.html;
        }
    }
}
