    label: { en: Concept, de: Konzept, fr: Concept }
  - id: procedure
    label: { en: Procedure, de: Handlungsanleitung, fr: Procédure }
  - id: reference
    label: { en: Reference, de: Referenz, fr: Référence }
  - id: safety
    label: { en: Safety information, de: Sicherheitshinweise, fr: Consignes de sécurité }
