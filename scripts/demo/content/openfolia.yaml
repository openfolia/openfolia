  - id: snippet
    label: { en: Snippet, de: Textbaustein, fr: Fragment de texte }
    snippet: true
audiences:
  - id: owner
    label: { en: Owners, de: Fahrzeughalter, fr: Propriétaires }
  - id: technician
    label: { en: Service technicians, de: Servicetechniker, fr: Techniciens de maintenance }
facets:
  - id: product
    label: { en: Product, de: Produkt, fr: Produit }
    values:
      - id: fenna
        label: { en: Orvik Fenna, de: Orvik Fenna, fr: Orvik Fenna }
variantAttributes:
  - id: body
    label: { en: Body style, de: Karosserie, fr: Carrosserie }
    kind: enum
    values:
      - id: hatchback
        label: { en: Hatchback, de: Schrägheck, fr: Berline à hayon }
      - id: estate
        label: { en: Estate, de: Kombi, fr: Break }
  - id: drive
    label: { en: Drive, de: Antrieb, fr: Motorisation }
    kind: enum
    values:
      - id: petrol
        label: { en: Petrol, de: Benzin, fr: Essence }
      - id: electric
        label: { en: Electric, de: Elektro, fr: Électrique }
  - id: market
    label: { en: Market, de: Markt, fr: Marché }
