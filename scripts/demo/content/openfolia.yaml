  - id: w001
    label: { en: General warning, de: Allgemeines Warnzeichen, fr: Avertissement général }
  - id: w012
    label: { en: Electricity, de: Warnung vor elektrischer Spannung, fr: Danger électrique }
  - id: w017
    label: { en: Hot surface, de: Warnung vor heißer Oberfläche, fr: Surface chaude }
release:
