    values:
      - id: eu
        label: { en: EU (left-hand drive), de: EU (Linkslenker), fr: UE (conduite à gauche) }
      - id: uk
        label: { en: UK (right-hand drive), de: UK (Rechtslenker), fr: Royaume-Uni (conduite à droite) }
  - id: software
    label: { en: Software, de: Software, fr: Logiciel }
